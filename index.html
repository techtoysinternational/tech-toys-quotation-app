function saveQuote(forPrint=false){
  const q = editingQuote;
  const typedClient = document.getElementById('eq_client').value.trim();
  const projInp = document.getElementById('eq_project');
  q.project_name = projInp ? projInp.value.trim() : '';
  q.date = document.getElementById('eq_date').value || today();
  q.pi_no = document.getElementById('eq_pi').value.trim();
  q.status = document.getElementById('eq_status').value;
  q.tax_type = document.getElementById('eq_tax_type').value;
  q.tax_pct = q.tax_type==='NONE' ? 0 : 18;
  q.discount = +document.getElementById('eq_discount').value || 0;
  q.notes = document.getElementById('eq_notes').value;
  q.updated = new Date().toISOString();

  // Client must be linked to a saved client record
  if(!q.client_id){
    alert('Please pick a client from the suggestions, or click "+ Add new client" to create one. The Client field cannot be free text.');
    return;
  }
  const linked = DB.clients.find(c=>c.id===q.client_id);
  if(!linked){
    alert('Linked client no longer exists. Please pick a client again.');
    return;
  }
  if(!reconcileOpenQuote(q))return;
  q.client = linked.name; // keep denormalised cache in sync with the linked record
  // Project name is optional — encouraged for clarity but allowed blank (e.g. RENTAL quotes)
  if(q.project_name){
    if(!linked.projects) linked.projects = [];
    if(!linked.projects.some(p=>p.toLowerCase()===q.project_name.toLowerCase())){
      linked.projects.push(q.project_name);
    }
  }
  if(q.items.length===0 && !confirm('Save quote with no line items?')) return;

  // strip private flags
  delete q._isNew;
  q.items.forEach(it=>delete it._priceAsked);

  saveQuotePortfolioLink(q);
  // upsert
  const idx = DB.quotes.findIndex(x=>x.id===q.id);
  if(idx >= 0) DB.quotes[idx] = q;
  else DB.quotes.push(q);

  saveDB();
  toast('Quote saved');
  if(!forPrint)navigate('quote', q.id);
  return q.id;
}

function saveClient(id){
  ensureClients();
  const data = {
    name: document.getElementById('ec_name').value.trim(),
    contact_person: document.getElementById('ec_cp').value.trim(),
    phone: document.getElementById('ec_ph').value.trim(),
    email: document.getElementById('ec_em').value.trim(),
    address_l1: document.getElementById('ec_a1').value.trim(),
    address_l2: document.getElementById('ec_a2').value.trim(),
    city: document.getElementById('ec_city').value.trim(),
    state: document.getElementById('ec_state').value.trim(),
    pincode: document.getElementById('ec_pin').value.trim(),
    gstin: document.getElementById('ec_gst').value.trim().toUpperCase(),
    pan: document.getElementById('ec_pan').value.trim().toUpperCase(),
    projects: document.getElementById('ec_proj').value.split('\n').map(s=>s.trim()).filter(Boolean),
    notes: document.getElementById('ec_notes').value.trim(),
  };
  if(!data.name){ alert('Client name is required'); return; }
  if(id){
    const c = DB.clients.find(x=>x.id===id);
    Object.assign(c, data);
  } else {
    let n = 1; while(DB.clients.find(c=>c.id===`C${String(n).padStart(4,'0')}`)) n++;
    data.id = `C${String(n).padStart(4,'0')}`;
    data.created = new Date().toISOString();
    DB.clients.push(data);
  }
  saveDB();
  closeModal();
  toast(id ? 'Client saved' : 'Client added');
  if(CURRENT_VIEW==='clients') renderClients();
  else if(CURRENT_VIEW==='client') renderClientDetail(id||data.id);
  else if(CURRENT_VIEW==='new-quote' || CURRENT_VIEW==='edit-quote') {
    // If we just CREATED a new client (not edited), auto-link it to the quote in progress
    if(!id && editingQuote){
      const newClient = DB.clients.find(c=>c.id===data.id);
      if(newClient){
        editingQuote.client = newClient.name;
        editingQuote.client_id = newClient.id;
        // Reflect in the form: input value, link line, and project datalist
        const inp = document.getElementById('eq_client');
        if(inp) inp.value = newClient.name;
        const link = document.getElementById('eq_client_link');
        if(link) link.innerHTML = `Linked to <b>${escapeHTML(newClient.name)}</b>${newClient.gstin?` · GSTIN ${escapeHTML(newClient.gstin)}`:''} · <a href="#" onclick="event.preventDefault();unlinkClient()">Unlink</a>`;
        const dl = document.getElementById('eq_proj_list');
        if(dl) dl.innerHTML = (newClient.projects||[]).map(p=>`<option value="${escapeHTML(p)}">`).join('');
        hideClientAC();
        toast('New client linked to this quote');
      }
    }
  }
}

function deleteClient(id){

  let msg = 'Delete this client?';
  if(used) msg += `\n\nNote: ${used} existing quote${used===1?'':'s'} reference this client. The quotes will keep the client name but lose the link.`;
  if(!confirm(msg)) return;
  DB.clients = DB.clients.filter(c=>c.id!==id);

function importData(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = e=>{
    try{
      const obj = JSON.parse(e.target.result);
      ProjectsCore.validate(obj);
      if(!confirm('Load this backup as the current dataset? A downloadable safety backup of your current data will be kept first. The Projects portfolio will be added without changing the imported quotation or payment records.')) return;
      projectStorageBackup(JSON.stringify(DB), 'before-import');
      ensureProjectMigration(obj, e.target.result);
      obj.portfolio.data_origin = 'imported';
      DB = obj;
      saveDB();
      loadDB();
      toast('Restored');
      navigate('dashboard');
    }catch(err){ alert('Backup was not loaded: ' + (err.message || String(err))); }
  };
  r.readAsText(file);
}

/* -------- Merge multiple quotations into one combined PDF -------- */
function mergeSelectedQuotes(){
  const ids = Array.from(selectedQuoteIds);
  if(ids.length < 2){ alert('Select at least 2 quotations to merge.'); return; }
  const quotes = ids.map(id => DB.quotes.find(q => q.id === id)).filter(Boolean);
  if(quotes.length < 2){ alert('Some selected quotations no longer exist.'); return; }

  // Enforce same client — a merged quotation only makes sense per client.
  const clientIds = new Set(quotes.map(q => q.client_id).filter(Boolean));
  const looseClients = new Set(quotes.filter(q => !q.client_id).map(q => (q.client||'').toLowerCase()));
  if(clientIds.size > 1 || (clientIds.size === 0 && looseClients.size > 1) || (clientIds.size === 1 && looseClients.size > 0)){
    const names = [...new Set(quotes.map(q => {
      const c = q.client_id ? (DB.clients||[]).find(x=>x.id===q.client_id) : null;
      return c ? c.name : (q.client||'(no client)');
    }))];
    alert(`Cannot merge — selected quotations belong to different clients:\n\n${names.join('\n')}\n\nPlease select quotations for a single client only.`);
    return;
  }
  // Sort by date ascending so the combined PDF reads chronologically.
  quotes.sort((a,b) => (a.date||'').localeCompare(b.date||''));
  printMergedQuote(quotes);
}

/* ============================================================
   COMPOSITE ESTIMATES: club 2+ quotations into one estimate
   Each quotation becomes a lettered section (A, B, C...). Sections stay
   LINKED to their source quote, so editing a quote updates the estimate.
   ============================================================ */
const ESTIMATE_STATUSES = ['Draft','Sent','Won','Lost'];
const ESTIMATE_DOC_TITLES = ['PROFORMA INVOICE','COMPOSITE ESTIMATE','QUOTATION'];
const SECTION_LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const BUILTIN_ESTIMATE_NOTE = 'ALL WOODEN, GLASS, ALUMINIUM AND IRON STRUCTURE SHALL BE CHARGED AS PER ACTUAL. ALL ELECTRICAL POINTS TO BE PROVIDED BY THE CLIENT.';
const BUILTIN_PAYMENT_TERMS = '80% ADVANCE PAYMENT\n10% DURING INSTALL\n10% AT THE TIME OF HANDOVER';
const BUILTIN_ESTIMATE_TERMS = `All Prices are FOR Kolkata
All Prices are excluding Taxes and Freight.
Supply, Installation, Testing and commissioning would be in the scope of TECH TOYS
Warranty 12 months from the date of Supply as per the Policy and terms applicable during supply
Delivery 1 week from the date of confirmed order and advance`;

function ensureEstimates(){ if(!Array.isArray(DB.estimates)) DB.estimates = []; }

function nextEstimateId(){
  let n = 1;
  while((DB.estimates||[]).find(e=>e.id===`E${String(n).padStart(4,'0')}`)) n++;
  return `E${String(n).padStart(4,'0')}`;
}
function nextEstimateNo(){
  const seq = (DB.next_est_seq || 0) + 1;
  DB.next_est_seq = seq;
  const yy = String(new Date().getFullYear()).slice(-2);
  return `EST-${yy}-${String(seq).padStart(2,'0')}`;
}

/* Resolve each section against its live source quote. */
function estimateSections(e){
  return (e.sections||[]).map((s,i)=>{
    const q = (DB.quotes||[]).find(x=>x.id===s.quote_id) || null;
    const items = q ? (q.items||[]) : [];
    const gross = items.reduce((sum,it)=>sum + (+it.qty||0)*(+it.price||0), 0);
    const disc = q ? (+q.discount||0) : 0;
    return {
      letter: SECTION_LETTERS[i] || String(i+1),
      label: s.label || (q ? (q.project_name || q.client || q.pi_no || '') : ''),
      quote_id: s.quote_id,
      quote: q,
      items, gross, disc,
      total: Math.max(0, gross - disc),
      missing: !q,
    };
  });
}
function estimateSubtotal(e){ return estimateSections(e).reduce((s,x)=>s+x.total, 0); }
function estimateDiscountAmt(e){
  const sub = estimateSubtotal(e);
  const amt = (e.discount_mode === 'AMT') ? (+e.discount_amt||0) : sub * (+e.discount_pct||0)/100;
  return Math.min(sub, Math.max(0, amt));
}
function estimateAfterDiscount(e){ return Math.max(0, estimateSubtotal(e) - estimateDiscountAmt(e)); }
function estimateTax(e){
  if(e.tax_type === 'SGST_CGST' || e.tax_type === 'IGST') return estimateAfterDiscount(e) * 0.18;
  return 0;
}
function estimateTotal(e){ return estimateAfterDiscount(e) + estimateTax(e); }
function estimateGrandLabel(e){
  const secs = estimateSections(e);
  return secs.length ? secs.map(s=>s.letter).join('+') : 'TOTAL';
}
function estimateClientName(e){
  const c = e.client_id ? (DB.clients||[]).find(x=>x.id===e.client_id) : null;
  return c ? c.name : (e.client||'');
}
function estimateFY(e){
  if(!e || !e.date) return null;
  const d = new Date(e.date);
  if(isNaN(d)) return null;
  const y = d.getFullYear(), m = d.getMonth();
  const fyStart = m >= 3 ? y : y - 1;
  return `FY ${fyStart}-${String(fyStart+1).slice(-2)}`;
}
function filterEstimatesByFY(list){
  if(CURRENT_FY === 'all') return list;
  const target = activeFY();
  return list.filter(e => estimateFY(e) === target);
}

/* -------- Create -------- */
function createEstimate(quoteIds){
  ensureEstimates();
  const ids = Array.isArray(quoteIds) ? quoteIds : [];
  const quotes = ids.map(id => (DB.quotes||[]).find(q=>q.id===id)).filter(Boolean);
  quotes.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const first = quotes[0];

  const e = {
    id: nextEstimateId(),
    est_no: nextEstimateNo(),
    doc_title: 'PROFORMA INVOICE',
    date: today(),
    client_id: first ? (first.client_id||'') : '',
    client: first && !first.client_id ? (first.client||'') : '',
    project_name: '',
    sections: quotes.map(q => ({ quote_id: q.id, label: (q.project_name || q.client || q.pi_no || '').toUpperCase() })),
    discount_mode: 'PCT',
    discount_pct: 0,
    discount_amt: 0,
    tax_type: 'NONE',
    support_note: '',
    note_box: BUILTIN_ESTIMATE_NOTE,
    payment_terms: BUILTIN_PAYMENT_TERMS,
    terms: BUILTIN_ESTIMATE_TERMS,
    notes: '',
    status: 'Draft',
    created: new Date().toISOString(),
    updated: new Date().toISOString(),
  };
  DB.estimates.push(e);
  saveDB();
  navigate('estimate', e.id);
}

/* Build an estimate straight from the ticked quotations on the Quotations page. */
function composeEstimateFromSelection(){
  const ids = Array.from(selectedQuoteIds);
  if(ids.length < 2){ alert('Tick at least 2 quotations to compose an estimate.'); return; }
  const quotes = ids.map(id => DB.quotes.find(q=>q.id===id)).filter(Boolean);
  if(quotes.length < 2){ alert('Some selected quotations no longer exist.'); return; }
  const clientIds = new Set(quotes.map(q => q.client_id).filter(Boolean));
  const looseClients = new Set(quotes.filter(q => !q.client_id).map(q => (q.client||'').toLowerCase()));
  if(clientIds.size > 1 || (clientIds.size === 1 && looseClients.size > 0) || (clientIds.size === 0 && looseClients.size > 1)){
    const names = [...new Set(quotes.map(q => {
      const c = q.client_id ? (DB.clients||[]).find(x=>x.id===q.client_id) : null;
      return c ? c.name : (q.client||'(no client)');
    }))];
    if(!confirm(`These quotations belong to different clients:\n\n${names.join('\n')}\n\nCompose them into one estimate anyway?`)) return;
  }
  clearQuoteSelection();
  createEstimate(quotes.map(q=>q.id));
}

/* Pulls every field on the builder page into the estimate object. */
function collectEstimateForm(e){
  const map = {
    est_no: 'ed_no', date: 'ed_date', project_name: 'ed_project', notes: 'ed_notes',

  };

  if(clientEl && !clientEl.disabled) e.client = clientEl.value;
  document.querySelectorAll('.ce-sec-card input[data-secidx]').forEach(inp=>{

function updateEstimateField(id, field, val, rerender){
  const e = (DB.estimates||[]).find(x=>x.id===id);
  if(!e) return;
  collectEstimateForm(e);            // don't lose anything typed but not yet saved
  e[field] = val;
  if(field === 'client_id' && val) e.client = '';
  e.updated = new Date().toISOString();
  saveDB();
  if(rerender) renderEstimateDetail(id); else toast('Saved');
}

function saveEstimate(id){
  const e = (DB.estimates||[]).find(x=>x.id===id);
  if(!e) return;
  collectEstimateForm(e);
  e.updated = new Date().toISOString();
  saveDB();
  toast('Estimate saved');
  renderEstimateDetail(id);
}

function moveEstimateSection(id, idx, dir){
  const e = (DB.estimates||[]).find(x=>x.id===id);
  if(!e) return;
  collectEstimateForm(e);
  const j = idx + dir;
  if(j < 0 || j >= e.sections.length) return;
  const [moved] = e.sections.splice(idx, 1);
  e.sections.splice(j, 0, moved);
  e.updated = new Date().toISOString();
  saveDB();
  renderEstimateDetail(id);
}

function removeEstimateSection(id, idx){
  const e = (DB.estimates||[]).find(x=>x.id===id);
  if(!e) return;
  collectEstimateForm(e);
  const s = estimateSections(e)[idx];
  if(!confirm(`Remove section ${s ? s.letter+'. '+(s.label||'') : ''} from this estimate?\n\nThe quotation itself is not deleted.`)) return;
  e.sections.splice(idx, 1);
  e.updated = new Date().toISOString();
  saveDB();
  toast('Section removed');
  renderEstimateDetail(id);
}

function duplicateEstimate(id){
  const src = (DB.estimates||[]).find(x=>x.id===id);
  if(!src) return;
  collectEstimateForm(src);
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = nextEstimateId();
  copy.est_no = nextEstimateNo();
  copy.date = today();
  copy.status = 'Draft';
  copy.created = copy.updated = new Date().toISOString();
  DB.estimates.push(copy);
  saveDB();
  toast(`Duplicated as ${copy.est_no}`);
  navigate('estimate', copy.id);
}

function deleteEstimate(id){
  const e = (DB.estimates||[]).find(x=>x.id===id);
  if(!e) return;
  if(!confirm(`Delete estimate ${e.est_no||e.id}? This cannot be undone.\n\nThe quotations inside it are NOT deleted.`)) return;
  DB.estimates = DB.estimates.filter(x=>x.id!==id);
  saveDB();
  toast('Estimate deleted');
  navigate('estimates');
}

function renderEstPickerList(){
  const e = (DB.estimates||[]).find(x=>x.id===estPicker.estId);
  const box = document.getElementById('estPickList');
  if(!e || !box) return;
  const already = new Set((e.sections||[]).map(s=>s.quote_id));
  const estClientName = (estimateClientName(e)||'').toLowerCase();

  let qs = (DB.quotes||[]).filter(q => !already.has(q.id));
  if(!estPicker.allClients && (e.client_id || estClientName)){
    qs = qs.filter(q => e.client_id
      ? q.client_id === e.client_id
      : (q.client||'').toLowerCase() === estClientName);
  }
  if(estPicker.q){
    const t = estPicker.q.toLowerCase();
    qs = qs.filter(q=>{
      const linked = q.client_id ? (DB.clients||[]).find(c=>c.id===q.client_id) : null;
      return (((linked?linked.name:q.client)||'')+' '+(q.project_name||'')+' '+(q.pi_no||'')).toLowerCase().includes(t);
    });
  }
  qs.sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  const btn = document.getElementById('epq_add');
  if(btn) btn.textContent = estPicker.sel.size ? `Add ${estPicker.sel.size} selected` : 'Add selected';

  box.innerHTML = qs.length === 0
    ? `<div class="empty" style="padding:24px">No quotations available.${estPicker.allClients?'':' Try ticking “Show quotations from all clients”.'}</div>`
    : qs.map(q=>{
        const linked = q.client_id ? (DB.clients||[]).find(c=>c.id===q.client_id) : null;
        const clientName = linked ? linked.name : (q.client||'');
        const itemsTotal = (q.items||[]).reduce((s,it)=>s+(+it.qty||0)*(+it.price||0),0) - (+q.discount||0);
        const checked = estPicker.sel.has(q.id);
        return `<div class="ce-pick-row" onclick="toggleEstPick('${q.id}')">
          <input type="checkbox" ${checked?'checked':''} onclick="event.stopPropagation();toggleEstPick('${q.id}')">
          <div class="grow">
            <div><b>${escapeHTML(q.project_name || clientName || '(unnamed)')}</b> <span class="tag">${escapeHTML(q.pi_no||q.id)}</span></div>
            <div class="muted" style="font-size:12px">${escapeHTML(clientName)} · ${fmtDate(q.date)} · ${(q.items||[]).length} item(s) · ${escapeHTML(q.status||'')}</div>
          </div>
          <div class="amt">${fmtINR(Math.max(0,itemsTotal))}</div>
        </div>`;
      }).join('');
}

function toggleEstPick(qid){
  if(estPicker.sel.has(qid)) estPicker.sel.delete(qid); else estPicker.sel.add(qid);
  renderEstPickerList();
}

function addPickedQuotes(){
  const e = (DB.estimates||[]).find(x=>x.id===estPicker.estId);
  if(!e) return;
  if(estPicker.sel.size === 0){ toast('Tick at least one quotation', 'error'); return; }
  const picked = Array.from(estPicker.sel)
    .map(id => (DB.quotes||[]).find(q=>q.id===id))
    .filter(Boolean)
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  picked.forEach(q=>{
    e.sections.push({ quote_id: q.id, label: (q.project_name || q.client || q.pi_no || '').toUpperCase() });
  });
  // Adopt the client from the first quotation if the estimate has none yet.
  if(!e.client_id && !e.client && picked[0]){
    if(picked[0].client_id) e.client_id = picked[0].client_id;
    else e.client = picked[0].client || '';
  }
  e.updated = new Date().toISOString();
  saveDB();
  closeModal();
  toast(`Added ${picked.length} quotation${picked.length===1?'':'s'}`);
  renderEstimateDetail(e.id);
}

function planClientCleanup(){
  ensureClients();
  const mapByOld = {};
  CLEANUP_MAPPING.forEach(m=>{ mapByOld[m.old.toLowerCase()] = m; });

  const targetClientNames = [...new Set(CLEANUP_MAPPING.filter(m=>m.client).map(m=>m.client))];
  const consolidatedCount = CLEANUP_MAPPING.filter(m=>m.client).length - targetClientNames.length;

  const quotesToDelete = [];
  const quotesToRelink = [];
  const quotesUnmatched = [];

  DB.quotes.forEach(q=>{
    const m = mapByOld[(q.client||'').toLowerCase()];
    if(!m){ quotesUnmatched.push(q); return; }
    if(m.action==='delete'){ quotesToDelete.push(q); return; }
    quotesToRelink.push({q, target: m});
  });

  // Existing auto-created clients that won't be needed any more
  const newClientNamesLc = new Set(targetClientNames.map(s=>s.toLowerCase()));
  const orphanedClients = (DB.clients||[]).filter(c => !newClientNamesLc.has(c.name.toLowerCase()));

  return {
    targetClientNames, consolidatedCount,
    quotesToDelete, quotesToRelink, quotesUnmatched,
    orphanedClients,
    newClientCount: targetClientNames.length,
  };
}

function applyClientCleanup(){
  const plan = planClientCleanup();
  ensureClients();

  // Find or create each consolidated client. Reuse an existing record if its name matches (case-insensitive).
  const clientByName = {};
  const existingByLcName = {};
  DB.clients.forEach(c => { existingByLcName[c.name.toLowerCase()] = c; });
  let nextN = 1;
  function nextClientId(){
    while(DB.clients.find(c=>c.id===`C${String(nextN).padStart(4,'0')}`)) nextN++;
    return `C${String(nextN).padStart(4,'0')}`;
  }

  plan.targetClientNames.forEach(name=>{
    const existing = existingByLcName[name.toLowerCase()];
    if(existing){
      existing.name = name; // normalise capitalisation
      clientByName[name] = existing;
    } else {
      const c = {
        id: nextClientId(),
        name, contact_person:'', phone:'', email:'',
        address_l1:'', address_l2:'', city:'', state:'', pincode:'',
        gstin:'', pan:'', projects:[], notes:'',
        created: new Date().toISOString(),
      };
      DB.clients.push(c);
      clientByName[name] = c;
    }
  });

  // Re-link quotes
  plan.quotesToRelink.forEach(({q,target})=>{
    const c = clientByName[target.client];
    q.client_id = c.id;
    q.client = c.name;
    q.project_name = target.project || '';
    if(target.project){
      if(!c.projects) c.projects = [];
      if(!c.projects.some(p=>p.toLowerCase()===target.project.toLowerCase())) c.projects.push(target.project);
    }
    q.updated = new Date().toISOString();
  });

  // Delete abandoned quotes
  const toDeleteIds = new Set(plan.quotesToDelete.map(q=>q.id));
  DB.quotes = DB.quotes.filter(q=>!toDeleteIds.has(q.id));

  // Drop orphaned clients (any DB.client whose name isn't in our consolidated set)
  const keepNames = new Set(plan.targetClientNames.map(s=>s.toLowerCase()));
  DB.clients = DB.clients.filter(c => keepNames.has(c.name.toLowerCase()));

  saveDB();
  closeModal();
  toast(`Cleanup done · ${plan.newClientCount} clients · ${plan.quotesToRelink.length} quotes re-linked`);
  navigate('clients');
}

const LEAD_SOURCES = ['Referral','Website','Walk-in','Cold Call','Social Media','Other'];
const LEAD_STALE_DAYS = 7;

function ensureLeads(){ if(!Array.isArray(DB.leads)) DB.leads = []; }
function nextLeadId(){
  let n = 1;
  while((DB.leads||[]).find(l=>l.id===`L${String(n).padStart(4,'0')}`)) n++;
  return `L${String(n).padStart(4,'0')}`;
}
function leadDaysIdle(lead){
  const ref = lead.updated || lead.created;
  if(!ref) return 0;
  return Math.floor((Date.now() - new Date(ref).getTime()) / (1000*60*60*24));
}
function leadIsStale(lead){
  return lead.status === 'Open' && leadDaysIdle(lead) >= LEAD_STALE_DAYS;
}
function openLeads(){
  ensureLeads();
  return DB.leads.filter(l => l.status === 'Open');
}

let leadFilter = {q:'', status:'Open'};

function renderLeads(){
  ensureLeads();
  let ls = [...DB.leads];
  if(leadFilter.q){
    const t = leadFilter.q.toLowerCase();

  }
  if(leadFilter.status) ls = ls.filter(l => l.status === leadFilter.status);
  // Sort: stale first, then newest
  ls.sort((a,b)=>{
    if(leadIsStale(a) !== leadIsStale(b)) return leadIsStale(a) ? -1 : 1;
    return (b.updated||b.created||'').localeCompare(a.updated||a.created||'');
  });

  const openCount = openLeads().length;
  const staleCount = openLeads().filter(leadIsStale).length;
  const totalEstimated = ls.reduce((s,l)=>s+(+l.estimated_value||0), 0);

  document.getElementById('mainView').innerHTML = `
    <div class="page-head">
      <div>
        <button class="btn btn-icon mobile-menu-btn" onclick="toggleSidebar()">☰</button>
        <div style="display:inline-block;vertical-align:middle">
          <div class="page-title">Leads <span class="tag" style="font-size:11px;font-weight:600">${openCount} open</span>${staleCount?` <span class="pill" style="background:var(--amber-dim);color:var(--amber)">⚠ ${staleCount} stale (>${LEAD_STALE_DAYS}d)</span>`:''}</div>
          <div class="page-sub">${ls.length} shown · ${fmtINR(totalEstimated)} estimated value</div>
        </div>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" onclick="openLeadModal()">➕ New Lead</button>
      </div>
    </div>

    <div class="search-row">
      <input id="lSearch" placeholder="Search client, project, contact, notes..." value="${escapeHTML(leadFilter.q)}">
      <select id="lStatus">
        <option value="">All statuses</option>
        ${['Open','Converted','Lost'].map(s=>`<option value="${s}" ${leadFilter.status===s?'selected':''}>${s}</option>`).join('')}
      </select>
    </div>

    <div class="card" style="padding:0">
      <table class="tbl tbl-clickable">
        <thead><tr><th>Client / Project</th><th>Contact</th><th>Source</th><th class="num">Est. Value</th><th>Next Follow-up</th><th>Idle</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${ls.length===0 ? '<tr><td colspan="8" class="empty">No leads match. Click <b>+ New Lead</b> to add one.</td></tr>' :
            ls.map(l=>{
              const idle = leadDaysIdle(l);
              const stale = leadIsStale(l);
              return `<tr onclick="openLeadModal('${l.id}')" style="${stale?'background:rgba(251,191,36,0.06)':''}">
                <td><b>${escapeHTML(l.client_name||'(no client)')}</b>${l.project_name?`<div class="muted" style="font-size:12px">${escapeHTML(l.project_name)}</div>`:''}</td>
                <td class="muted">${[l.contact_person,l.contact_phone].filter(Boolean).map(escapeHTML).join(' · ')||'—'}</td>
                <td><span class="tag">${escapeHTML(l.source||'—')}</span></td>
                <td class="num">${l.estimated_value ? fmtINR(l.estimated_value) : '<span class="muted">—</span>'}</td>
                <td class="muted">${l.next_followup ? fmtDate(l.next_followup) : '—'}</td>
                <td style="color:${stale?'var(--amber)':'var(--muted)'}"><b>${idle}d</b>${stale?' ⚠':''}</td>
                <td><span class="pill ${l.status==='Open'?'pill-pending':l.status==='Converted'?'pill-won':'pill-lost'}">${l.status}</span></td>
                <td>${l.status==='Open'?`<button class="btn btn-sm btn-primary" onclick="event.stopPropagation();convertLeadToQuote('${l.id}')">→ Convert</button>`:l.converted_quote_id?`<a href="#" onclick="event.preventDefault();event.stopPropagation();navigate('quote','${l.converted_quote_id}')">View quote →</a>`:''}</td>
              </tr>`;
            }).join('')}
        </tbody>
      </table>
    </div>
  `;
  document.getElementById('lSearch').oninput = e=>{ leadFilter.q = e.target.value; renderLeads(); };

function saveLead(id){
  ensureLeads();
  const data = {
    client_name: document.getElementById('el_cn').value.trim(),
    project_name: document.getElementById('el_pn').value.trim(),
    contact_person: document.getElementById('el_cp').value.trim(),
    contact_phone: document.getElementById('el_ph').value.trim(),
    contact_email: document.getElementById('el_em').value.trim(),
    source: document.getElementById('el_src').value,
    estimated_value: +document.getElementById('el_ev').value || 0,
    next_followup: document.getElementById('el_nf').value || '',
    notes: document.getElementById('el_nt').value.trim(),
    status: document.getElementById('el_st').value,
  };
  if(!data.client_name){ alert('Client / Company Name is required'); return; }
  const now = new Date().toISOString();
  if(id){
    const l = DB.leads.find(x=>x.id===id);
    Object.assign(l, data, {updated: now});
  } else {
    DB.leads.push({id: nextLeadId(), ...data, created: now, updated: now});
  }
  saveDB();
  closeModal();
  toast(id ? 'Lead updated' : 'Lead created');
  if(CURRENT_VIEW==='leads') renderLeads();
  else if(CURRENT_VIEW==='dashboard') renderDashboard();
}

function deleteLead(id){
  ensureLeads();
  const l = DB.leads.find(x=>x.id===id);
  if(!l) return;
  if(!confirm(`Delete lead "${l.client_name}"? This cannot be undone.`)) return;
  DB.leads = DB.leads.filter(x=>x.id!==id);
  saveDB();
  closeModal();
  toast('Lead deleted');
  if(CURRENT_VIEW==='leads') renderLeads();
  else if(CURRENT_VIEW==='dashboard') renderDashboard();
}

function convertLeadToQuote(id){
  ensureLeads();
  const lead = DB.leads.find(x=>x.id===id);
  if(!lead) return;
  if(lead.status !== 'Open'){
    if(!confirm(`This lead is already marked "${lead.status}". Convert to a new quote anyway?`)) return;
  }
  // Try to find or create a matching client
  let client = (DB.clients||[]).find(c => c.name.toLowerCase() === (lead.client_name||'').toLowerCase());
  if(!client){
    let n = 1; while((DB.clients||[]).find(c=>c.id===`C${String(n).padStart(4,'0')}`)) n++;
    client = {
      id: `C${String(n).padStart(4,'0')}`,
      name: lead.client_name,
      contact_person: lead.contact_person||'', phone: lead.contact_phone||'', email: lead.contact_email||'',
      address_l1:'', address_l2:'', city:'', state:'', pincode:'', gstin:'', pan:'',
      projects: lead.project_name ? [lead.project_name] : [],
      notes: lead.notes||'',
      created: new Date().toISOString(),
    };
    if(!DB.clients) DB.clients = [];
    DB.clients.push(client);
  } else if(lead.project_name && !(client.projects||[]).some(p=>p.toLowerCase()===lead.project_name.toLowerCase())){
    if(!client.projects) client.projects = [];
    client.projects.push(lead.project_name);
  }
  // Create a new Draft quote pre-filled from the lead
  const newQuote = {
    id: nextQuoteId(),
    pi_no: nextPiNo(),
    client: client.name,
    client_id: client.id,
    project_name: lead.project_name || '',
    date: today(),
    items: [],
    tax_type: 'SGST_CGST',
    tax_pct: 18,
    discount: 0,
    status: 'Draft',
    payments: [],
    expenses: [],
    amount_paid: 0,
    notes: lead.notes ? `Converted from lead ${lead.id}\n${lead.notes}` : `Converted from lead ${lead.id}`,
    terms: '',
    created: new Date().toISOString(),
    updated: new Date().toISOString(),
  };
  DB.quotes.push(newQuote);
  // Mark lead as converted
  lead.status = 'Converted';
  lead.converted_quote_id = newQuote.id;
  lead.updated = new Date().toISOString();
  saveDB();
  closeModal();
  toast(`Lead converted to ${newQuote.pi_no} (Draft)`);
  navigate('edit-quote', newQuote.id);
}

/* ============================================================
   RENTALS — event-based rental jobs (separate from sales quotes)
   ============================================================ */
const RENTAL_STATUSES = ['Upcoming','Done','Cancelled'];

function ensureRentals(){ if(!Array.isArray(DB.rentals)) DB.rentals = []; }
function nextRentalId(){
  let n = 1;
  while((DB.rentals||[]).find(r=>r.id===`R${String(n).padStart(4,'0')}`)) n++;
  return `R${String(n).padStart(4,'0')}`;
}
function rentalItemsSubtotal(r){
  return (r.items||[]).reduce((s,it)=>s + (+it.qty||0)*(+it.rate||0), 0);
}
function rentalTotal(r){
  // If items exist, prefer their subtotal; otherwise use the manual total_amount.
  if((r.items||[]).length > 0) return rentalItemsSubtotal(r);
  return +r.total_amount || 0;
}
function rentalPending(r){
  if(r.status === 'Cancelled') return 0;
  return Math.max(0, rentalTotal(r) - (+r.advance||0));
}
function rentalFY(r){
  if(!r || !r.event_date) return null;
  const d = new Date(r.event_date);
  if(isNaN(d)) return null;
  const y = d.getFullYear(), m = d.getMonth();
  const fyStart = m >= 3 ? y : y - 1;
  return `FY ${fyStart}-${String(fyStart+1).slice(-2)}`;
}
function filterRentalsByFY(rentals){
  if(CURRENT_FY === 'all') return rentals;
  const target = activeFY();
  return rentals.filter(r => rentalFY(r) === target);
}

let rentalsFilter = {q:'', status:''};

function renderRentals(){
  ensureRentals();
  let rs = filterRentalsByFY([...DB.rentals]);
  const totalInFY = rs.length;
  if(rentalsFilter.q){

    rs = rs.filter(r => ((r.event_manager||'')+' '+(r.venue||'')+' '+(r.reference||'')+' '+(r.notes||'')).toLowerCase().includes(t));
  }
  if(rentalsFilter.status) rs = rs.filter(r => r.status === rentalsFilter.status);
  // Sort by event date desc (most recent first)
  rs.sort((a,b)=>(b.event_date||'').localeCompare(a.event_date||''));

  const totalVal = rs.reduce((s,r)=>s+rentalTotal(r), 0);
  const totalPending = rs.reduce((s,r)=>s+rentalPending(r), 0);

  document.getElementById('mainView').innerHTML = `
    <div class="page-head">
      <div>
        <button class="btn btn-icon mobile-menu-btn" onclick="toggleSidebar()">☰</button>
        <div style="display:inline-block;vertical-align:middle">
          <div class="page-title">Rentals <span class="fy-badge">${escapeHTML(fyLabel())}</span></div>
          <div class="page-sub">${rs.length} of ${totalInFY} ${CURRENT_FY==='all'?'(all time)':'in '+escapeHTML(activeFY())} · ${fmtINR(totalVal)} total · ${fmtINR(totalPending)} pending</div>

      </div>

      <select id="rStatus">
        <option value="">All statuses</option>
        ${RENTAL_STATUSES.map(s=>`<option value="${s}" ${rentalsFilter.status===s?'selected':''}>${s}</option>`).join('')}
      </select>
    </div>

    <div class="card" style="padding:0">
      <table class="tbl tbl-clickable">
        <thead><tr><th>Event Date</th><th>Event Manager</th><th>Venue</th><th>Reference</th><th>Items</th><th>Status</th><th class="num">Total</th><th class="num">Advance</th><th class="num">Pending</th></tr></thead>
        <tbody>
          ${rs.length===0 ? '<tr><td colspan="9" class="empty">No rentals match. Click <b>+ New Rental</b> to add one.</td></tr>' :
            rs.map(r=>{
              const total = rentalTotal(r);
              const adv = +r.advance||0;
              const pending = rentalPending(r);
              return `<tr onclick="navigate('rental','${r.id}')">
                <td><b>${fmtDate(r.event_date)}</b></td>
                <td>${escapeHTML(r.event_manager||'—')}</td>

                <td class="muted">${escapeHTML(r.reference||'—')}</td>

                <td><span class="pill ${r.status==='Upcoming'?'pill-sent':r.status==='Done'?'pill-paid':'pill-lost'}">${r.status||'Upcoming'}</span></td>
                <td class="num"><b>${fmtINR(total)}</b></td>
                <td class="num" style="color:${adv>0?'var(--green)':'var(--muted)'}">${fmtINR(adv)}</td>
                <td class="num" style="color:${pending>0?'var(--amber)':'var(--muted)'}">${fmtINR(pending)}</td>
              </tr>`;
            }).join('')}
        </tbody>
      </table>
    </div>
  `;
  document.getElementById('rSearch').oninput = e=>{ rentalsFilter.q = e.target.value; renderRentals(); };
  document.getElementById('rStatus').onchange = e=>{ rentalsFilter.status = e.target.value; renderRentals(); };

function createNewRental(){
  ensureRentals();
  const r = {
    id: nextRentalId(),
    event_date: today(),
    event_manager: '',
    venue: '',
    reference: '',
    items: [],
    total_amount: 0,
    advance: 0,
    notes: '',
    status: 'Upcoming',
    created: new Date().toISOString(),
    updated: new Date().toISOString(),
  };
  DB.rentals.push(r);
  saveDB();
  navigate('rental', r.id);
}

function renderRentalDetail(id){
  ensureRentals();
  const r = DB.rentals.find(x=>x.id===id);
  if(!r){
    document.getElementById('mainView').innerHTML = '<div class="empty">Rental not found.</div>';
    return;
  }
  const total = rentalTotal(r);
  const pending = rentalPending(r);

  document.getElementById('mainView').innerHTML = `
    <div class="page-head">
      <div>
        <button class="btn btn-icon mobile-menu-btn" onclick="toggleSidebar()">☰</button>
        <div style="display:inline-block;vertical-align:middle">
          <div class="page-title">${r.event_manager?escapeHTML(r.event_manager):'(no event manager)'} <span class="tag" style="font-size:11px;font-weight:600">${escapeHTML(r.id)}</span></div>
          <div class="page-sub">${escapeHTML(r.venue||'(no venue)')} · ${fmtDate(r.event_date)} · ${(r.items||[]).length} item(s)</div>
        </div>
      </div>
      <div class="page-actions">
        <button class="btn" onclick="navigate('rentals')">← Back</button>
        <button class="btn" onclick="printRental('${r.id}')">🖨 Print / Save PDF</button>
        <button class="btn btn-danger" onclick="deleteRental('${r.id}')">🗑 Delete</button>
        <button class="btn btn-primary" onclick="saveRental('${r.id}')">💾 Save</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><div class="card-title">Event details</div></div>
      <div class="form-grid">
        <div class="field"><label>Date of Event *</label><input id="rd_date" type="date" value="${escapeHTML(r.event_date||'')}" onchange="updateRentalField('${r.id}','event_date',this.value)"></div>
        <div class="field"><label>Status</label>
          <select id="rd_status" onchange="updateRentalField('${r.id}','status',this.value)">
            ${RENTAL_STATUSES.map(s=>`<option value="${s}" ${r.status===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Event Manager Name *</label><input id="rd_mgr" value="${escapeHTML(r.event_manager||'')}" placeholder="e.g. Rajesh Kumar" onchange="updateRentalField('${r.id}','event_manager',this.value)"></div>
        <div class="field"><label>Reference</label><input id="rd_ref" value="${escapeHTML(r.reference||'')}" placeholder="Booking ref / PO / contact #" onchange="updateRentalField('${r.id}','reference',this.value)"></div>
        <div class="field full"><label>Venue</label><input id="rd_venue" value="${escapeHTML(r.venue||'')}" placeholder="e.g. Hyatt Regency, Kolkata" onchange="updateRentalField('${r.id}','venue',this.value)"></div>
        <div class="field full"><label>Notes</label><textarea id="rd_notes" rows="2" placeholder="Setup time, special requirements, contact details..." onchange="updateRentalField('${r.id}','notes',this.value)">${escapeHTML(r.notes||'')}</textarea></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="card-title">Items</div>
        <button class="btn btn-sm btn-primary" onclick="addRentalLineItem('${r.id}')">+ Add row</button>
      </div>
      <table class="li-tbl">
        <thead>
          <tr>
            <th style="width:24px"></th>
            <th style="width:240px">Make / Brand</th>
            <th>Description</th>
            <th style="width:80px" class="num">Qty</th>
            <th style="width:120px" class="num">Rate (₹)</th>
            <th style="width:130px" class="num">Amount</th>
            <th style="width:30px"></th>
          </tr>
        </thead>
        <tbody id="rentalItemsBody">
          ${(r.items||[]).map((it,i)=>`
            <tr>
              <td class="muted" style="text-align:center;padding:11px 4px">${i+1}</td>
              <td><input data-field="make" data-idx="${i}" value="${escapeHTML(it.make||'')}" placeholder="Item make/brand"></td>
              <td><input data-field="desc" data-idx="${i}" value="${escapeHTML(it.desc||'')}" placeholder="Description / specs"></td>
              <td class="num"><input data-field="qty" data-idx="${i}" type="number" step="any" value="${it.qty||0}"></td>
              <td class="num"><input data-field="rate" data-idx="${i}" type="number" step="0.01" value="${it.rate||0}"></td>
              <td class="li-amt">${fmtINR((it.qty||0)*(it.rate||0))}</td>
              <td><button class="btn btn-icon btn-ghost" title="Remove" onclick="removeRentalLineItem('${r.id}',${i})">×</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      ${(r.items||[]).length===0 ? '<div style="padding:24px;text-align:center;color:var(--muted)">No items yet. Click <b>+ Add row</b> to add rental items.</div>' : ''}
    </div>

    <div class="card">
      <div class="card-head"><div class="card-title">Payment</div></div>
      <div class="form-grid">
        <div class="field"><label>Advance Received (₹)</label><input id="rd_advance" type="number" step="0.01" min="0" value="${r.advance||0}" onchange="updateRentalField('${r.id}','advance',+this.value||0)"></div>
      </div>
      <div class="totals">
        <div class="lbl grand">Total Amount</div><div class="val grand">${fmtINR(total)}</div>
        <div class="lbl" style="color:var(--green)">Advance</div><div class="val" style="color:var(--green)">${fmtINR(+r.advance||0)}</div>
        <div class="lbl" style="color:${pending>0?'var(--amber)':'var(--muted)'}">Pending</div><div class="val" style="color:${pending>0?'var(--amber)':'var(--muted)'}">${fmtINR(pending)}</div>
      </div>
    </div>
  `;

  // Wire up rental item inputs (auto-save on input change)
  document.querySelectorAll('#rentalItemsBody input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const idx = +e.target.dataset.idx;
      const field = e.target.dataset.field;
      let val = e.target.value;
      if(field==='qty' || field==='rate') val = +val || 0;
      r.items[idx][field] = val;
      // Update the row's amount cell so the user sees the change live
      const row = e.target.closest('tr');
      if(row){
        const amtCell = row.querySelector('.li-amt');
        if(amtCell) amtCell.textContent = fmtINR((r.items[idx].qty||0)*(r.items[idx].rate||0));
      }
    });
    // Save silently on blur (no re-render — preserves focus so the user
    // can tab between line item cells without the DOM rebuilding).
    inp.addEventListener('blur', ()=>{
      r.updated = new Date().toISOString();
      saveDB();
    });
  });
}

function collectRentalForm(r){
  // Pulls current values from every input on the rental detail page into r.
  // Safe to call when the form isn't on screen (all lookups null-guard).
  const fields = {
    event_date: 'rd_date',
    event_manager: 'rd_mgr',
    venue: 'rd_venue',
    reference: 'rd_ref',
    notes: 'rd_notes',
    status: 'rd_status',
  };
  Object.entries(fields).forEach(([key, id])=>{
    const el = document.getElementById(id);
    if(el) r[key] = el.value;
  });
  const advEl = document.getElementById('rd_advance');
  if(advEl) r.advance = +advEl.value || 0;

  // Line items (already in r.items via input handler, but re-read just in case
  // the user typed in a field and clicked Save without blurring first).
  document.querySelectorAll('#rentalItemsBody input').forEach(inp=>{
    const idx = +inp.dataset.idx;
    const field = inp.dataset.field;
    if(!r.items[idx]) return;
    let val = inp.value;
    if(field==='qty' || field==='rate') val = +val || 0;
    r.items[idx][field] = val;
  });
}

function saveRental(id){
  // Explicit Save button handler. Pulls current values from every input
  // on the page, writes to DB, then re-renders so totals refresh.
  const r = DB.rentals.find(x=>x.id===id);
  if(!r) return;
  ensureRentals();

  collectRentalForm(r);

  r.updated = new Date().toISOString();
  saveDB();
  toast('Rental saved');
  renderRentalDetail(r.id);
}

function printRental(id){
  ensureRentals();
  const r = DB.rentals.find(x=>x.id===id);
  if(!r) return;
  // Capture any unsaved edits still sitting in the form before printing,
  // so the PDF always matches what's on screen. Only persist when something
  // actually changed — saveDB is not free and would delay the print dialog.
  if(document.getElementById('rd_date')){
    const before = JSON.stringify(r);
    collectRentalForm(r);
    if(JSON.stringify(r) !== before){
      r.updated = new Date().toISOString();
      saveDB();
    }
  }
  const c = DB.company;
  const total = rentalTotal(r);
  const adv = +r.advance || 0;
  const pending = rentalPending(r);
  const hasItems = (r.items||[]).length > 0;
  const statusColor = r.status==='Done' ? '#10b981' : r.status==='Cancelled' ? '#ef4444' : '#ff7a2f';

  const itemRows = hasItems
    ? r.items.map((it,i)=>`
        <tr>
          <td>${i+1}</td>
          <td>
            <div class="item-make">${escapeHTML(it.make||'')}</div>
            <div class="item-desc">${escapeHTML(it.desc||'')}</div>
          </td>
          <td class="num">${fmtNum(it.qty)}</td>
          <td class="num">${fmtINR2(it.rate)}</td>
          <td class="num"><b>${fmtINR2((it.qty||0)*(it.rate||0))}</b></td>
        </tr>
      `).join('')
    : `<tr>
        <td>1</td>
        <td><div class="item-make">Rental services</div><div class="item-desc">Equipment rental for event, as agreed</div></td>
        <td class="num">1</td>
        <td class="num">${fmtINR2(total)}</td>
        <td class="num"><b>${fmtINR2(total)}</b></td>
      </tr>`;

  const html = `
    <div class="print-page">
      <div class="print-header">
        <div>
          <div class="print-brand">${escapeHTML(c.name)}</div>
          <div class="print-tag">${escapeHTML(c.tagline||'')}</div>
          <div style="font-size:9pt;color:#666;margin-top:8px">
            ${escapeHTML(c.address_l1||'')}, ${escapeHTML(c.address_l2||'')}<br>
            GSTIN: ${escapeHTML(c.gstin||'')} · PAN: ${escapeHTML(c.pan||'')} · State: ${escapeHTML(c.state||'')} (${escapeHTML(c.state_code||'')})<br>
            ${escapeHTML(c.email||'')} · ${escapeHTML(c.phone||'')}
          </div>
        </div>
        <div class="print-meta">
          <div style="font-size:14pt;font-weight:700;color:#1a1a1a;margin-bottom:4px">RENTAL QUOTATION</div>
          <div class="pi">${escapeHTML(r.id)}</div>
          <div style="margin-top:6px">Event Date: <b>${fmtDate(r.event_date)}</b></div>
        </div>
      </div>

      <div class="print-cust">
        <div class="print-cust-block">
          <div class="print-section-title">Rental For</div>
          <div class="name">${escapeHTML(r.event_manager||'')}</div>
          ${r.venue ? `<div class="addr"><b>Venue:</b> ${escapeHTML(r.venue)}</div>` : ''}
          ${r.reference ? `<div class="addr" style="margin-top:3px"><b>Reference:</b> ${escapeHTML(r.reference)}</div>` : ''}
          ${r.notes ? `<div class="addr" style="margin-top:6px;font-style:italic">${escapeHTML(r.notes)}</div>` : ''}
        </div>
        <div class="print-cust-block" style="text-align:right">
          <div class="print-section-title">Status</div>
          <div class="name" style="color:${statusColor}">${escapeHTML(r.status||'Upcoming')}</div>
        </div>
      </div>

      <table class="print-tbl">
        <thead>
          <tr>
            <th style="width:30px">#</th>
            <th>Item</th>
            <th style="width:60px" class="num">Qty</th>
            <th style="width:100px" class="num">Rate</th>
            <th style="width:110px" class="num">Amount</th>
          </tr>
        </thead>
        <tbody>${itemRows}</tbody>
      </table>

      <table class="print-totals">
        ${adv > 0 ? `
          <tr><td>Total Amount</td><td>${fmtINR2(total)}</td></tr>
          <tr><td>Advance Received</td><td>− ${fmtINR2(adv)}</td></tr>
          <tr class="grand"><td>Balance Due</td><td>${fmtINR2(pending)}</td></tr>
        ` : `
          <tr class="grand"><td>Total Amount</td><td>${fmtINR2(total)}</td></tr>
        `}
      </table>

      <div class="print-foot">
        <div>
          <div class="lbl">Bank Details</div>
          <div class="bank-line">${escapeHTML(c.bank_name||'')} · ${escapeHTML(c.bank_branch||'')}</div>
          <div class="bank-line">A/C Name: ${escapeHTML(c.bank_ac_name||'')}</div>
          <div class="bank-line">A/C No: <b>${escapeHTML(c.bank_ac||'')}</b></div>
          <div class="bank-line">IFSC: <b>${escapeHTML(c.bank_ifsc||'')}</b> · MICR: ${escapeHTML(c.bank_micr||'')}</div>
        </div>
        <div>
          <div class="lbl">Terms</div>
          ${(()=>{
            const txt = (c.default_terms && c.default_terms.trim()) || BUILTIN_DEFAULT_TERMS;
            return txt.split('\n').map(line=>`<div class="terms-line">${escapeHTML(line)}</div>`).join('');
          })()}
        </div>
      </div>

      <div class="print-sign">
        <div class="print-sign-line">For ${escapeHTML(c.name)}<br><b>${escapeHTML(c.contact_person||'')}</b></div>
      </div>
      <div class="print-thanks">Thank you for your business.</div>
    </div>
  `;

  document.getElementById('print-area').innerHTML = html;
  setTimeout(()=>{ window.print(); }, 100);
}

function updateRentalField(id, field, val){
  const r = DB.rentals.find(x=>x.id===id);
  if(!r) return;
  r[field] = val;
  r.updated = new Date().toISOString();
  saveDB();
  if(field==='status' || field==='advance' || field==='event_date' || field==='event_manager' || field==='venue') renderRentalDetail(id);
  toast('Saved');
}

function addRentalLineItem(id){
  const r = DB.rentals.find(x=>x.id===id);
  if(!r) return;
  if(!Array.isArray(r.items)) r.items = [];
  r.items.push({make:'', desc:'', qty:1, rate:0});
  r.updated = new Date().toISOString();
  saveDB();
  renderRentalDetail(id);
  // focus the new row's make field
  setTimeout(()=>{
    const inputs = document.querySelectorAll('#rentalItemsBody input[data-field="make"]');
    if(inputs.length) inputs[inputs.length-1].focus();
  }, 50);
}

function removeRentalLineItem(id, idx){
  const r = DB.rentals.find(x=>x.id===id);
  if(!r || !Array.isArray(r.items)) return;
  r.items.splice(idx, 1);
  r.updated = new Date().toISOString();
  saveDB();
  renderRentalDetail(id);
}

function deleteRental(id){
  const r = DB.rentals.find(x=>x.id===id);
  if(!r) return;
  if(!confirm(`Delete rental for "${r.event_manager||'(no manager)'}" on ${fmtDate(r.event_date)}? This cannot be undone.`)) return;
  DB.rentals = DB.rentals.filter(x=>x.id!==id);
  saveDB();
  toast('Rental deleted');
  navigate('rentals');
}

<script>
/* Tech Toys Auto Update Fix
   Clears old PWA caches and forces the newest GitHub Pages version to load. */
(function(){
  const BUILD_VERSION = '2026-09-15-owner-sync-email-project-fields-rentals-clean-v6';
  const BUILD_KEY = 'techToys_build_version';

  async function clearOldCaches(){
    if (!('caches' in window)) return;
    const keys = await caches.keys();
    await Promise.all(keys
      .filter(k => k.startsWith('techtoys-quotation') && k !== 'techtoys-quotation-auto-v2')
      .map(k => caches.delete(k))
    );
  }

  async function registerAutoUpdateSW(){
    if (location.protocol === 'file:' || !('serviceWorker' in navigator)) return;
    const reg = await navigator.serviceWorker.register('./service-worker.js?v=' + encodeURIComponent(BUILD_VERSION), {
      scope: './',
      updateViaCache: 'none'
    });
    await reg.update();
    if (reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'});
    reg.addEventListener('updatefound', () => {
      const worker = reg.installing;
      if (!worker) return;
      worker.addEventListener('statechange', () => {
        if (worker.state === 'installed' && navigator.serviceWorker.controller) {
          worker.postMessage({type:'SKIP_WAITING'});
          setTimeout(() => location.reload(), 500);
        }
      });
    });
  }

  window.addEventListener('load', async () => {
    try{
      await clearOldCaches();
      await registerAutoUpdateSW();
      const old = localStorage.getItem(BUILD_KEY);
      if (old !== BUILD_VERSION) {
        localStorage.setItem(BUILD_KEY, BUILD_VERSION);
        // Reload once after update so old service-worker-controlled pages are replaced.
        if (old) location.reload();
      }
    }catch(e){ console.warn('Auto update check failed', e); }
  });
})();
</script>
