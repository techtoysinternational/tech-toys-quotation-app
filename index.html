<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Toys — Quotation System</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0e14; --bg2:#11151d; --panel:#171c26; --panel2:#1f2532;
  --border:#2a3142; --border2:#3a4256;
  --text:#e6e8ee; --muted:#8b95a8; --muted2:#5b6478;
  --accent:#ff7a2f; --accent2:#ffa066; --accent-dim:#3a2615;
  --green:#2dd4bf; --green-dim:#0f2e2a;
  --red:#ef4444; --red-dim:#3a1515;
  --amber:#fbbf24; --amber-dim:#3a2a10;
  --blue:#60a5fa; --blue-dim:#15233a;
  --shadow:0 10px 40px rgba(0,0,0,.5);
}
html,body{height:100%;width:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;outline:none;transition:border .15s,background .15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--panel)}
input[type=number]{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:500;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--panel2);border-color:var(--border2)}
.btn-primary{background:var(--accent);color:#0b0e14;border-color:var(--accent);font-weight:600}
.btn-primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn-danger{background:var(--red-dim);border-color:#5a2020;color:#ffb4b4}
.btn-danger:hover{background:#5a2020}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--panel)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:7px;width:32px;height:32px;justify-content:center}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}
hr{border:none;border-top:1px solid var(--border);margin:16px 0}

/* Login */
.login-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 20%,#1a2030 0%,#0b0e14 60%);z-index:1000}
.login-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:40px;width:380px;max-width:90vw;box-shadow:var(--shadow)}
.login-logo{font-size:28px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,#fff,#ffa066);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:4px}
.login-tagline{color:var(--muted);font-size:13px;margin-bottom:28px}
.login-card label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.login-err{background:var(--red-dim);color:#ffb4b4;padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none;border:1px solid #5a2020}
.login-hint{color:var(--muted2);font-size:11px;margin-top:14px;text-align:center}

/* Layout */
.app{display:none;height:100vh;grid-template-columns:240px 1fr;overflow:hidden}
.app.show{display:grid}
.sidebar{background:var(--bg2);border-right:1px solid var(--border);padding:18px 0;display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:0 22px 18px;border-bottom:1px solid var(--border);margin-bottom:14px}
.brand-name{font-size:18px;font-weight:800;letter-spacing:-.3px;background:linear-gradient(135deg,#fff,#ffa066);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-sub{font-size:11px;color:var(--muted);margin-top:2px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 22px;color:var(--muted);cursor:pointer;border-left:3px solid transparent;transition:all .12s;font-weight:500}
.nav-item:hover{background:var(--panel);color:var(--text)}
.nav-item.active{background:var(--panel);color:var(--text);border-left-color:var(--accent)}
.nav-item .ico{width:18px;height:18px;flex-shrink:0;opacity:.85}
.nav-spacer{flex:1}
.fy-wrap{padding:0 22px 14px;border-bottom:1px solid var(--border);margin-bottom:12px}
.fy-wrap label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:5px}
.fy-wrap select{font-size:13px;padding:7px 10px}
.fy-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;background:var(--blue-dim);color:var(--blue);border-radius:99px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-left:8px}
.nav-footer{padding:12px 22px;border-top:1px solid var(--border);font-size:11px;color:var(--muted2)}
.nav-footer .user{color:var(--text);font-weight:600;font-size:12px;margin-bottom:2px}

/* Main */
.main{overflow-y:auto;padding:28px 36px}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:16px;flex-wrap:wrap}
.page-title{font-size:22px;font-weight:700;letter-spacing:-.3px}
.page-sub{font-size:13px;color:var(--muted);margin-top:2px}
.page-actions{display:flex;gap:8px}

/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:24px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px}
.kpi-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:8px}
.kpi-value{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.kpi-sub{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.green .kpi-value{color:var(--green)}
.kpi.red .kpi-value{color:var(--red)}
.kpi.amber .kpi-value{color:var(--amber)}
.kpi.blue .kpi-value{color:var(--blue)}
.kpi.accent .kpi-value{color:var(--accent2)}

/* Cards / panels */
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:15px;font-weight:600}
.card-sub{font-size:12px;color:var(--muted)}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--panel2)}
.tbl-clickable tr{cursor:pointer}
.tbl .num{text-align:right}
.tbl .center{text-align:center}

/* Status pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.pill-sent{background:var(--blue-dim);color:var(--blue)}
.pill-won{background:var(--green-dim);color:var(--green)}
.pill-paid{background:#103a26;color:#34d399}
.pill-lost{background:var(--red-dim);color:#fca5a5}
.pill-draft{background:var(--panel2);color:var(--muted)}
.pill-pending{background:var(--amber-dim);color:var(--amber)}

/* Forms */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.form-grid .full{grid-column:1/-1}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.field-help{font-size:11px;color:var(--muted2);margin-top:4px}

/* Search bar */
.search-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-row input,.search-row select{max-width:300px}

/* Line items table (new quote) */
.li-tbl{width:100%;border-collapse:separate;border-spacing:0;margin-top:8px}
.li-tbl th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border)}
.li-tbl td{padding:4px;vertical-align:top}
.li-tbl input{padding:7px 10px;font-size:13px}
.li-tbl .num input{text-align:right}
.li-row .li-amt{padding:10px 8px;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}

/* Autocomplete */
.ac-wrap{position:relative}
.ac-list{position:absolute;top:100%;left:0;right:0;background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-top:4px;max-height:280px;overflow-y:auto;z-index:50;box-shadow:var(--shadow);display:none}
.ac-list.show{display:block}
.ac-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.sel{background:var(--panel2)}
.ac-item .ac-make{font-weight:600}
.ac-item .ac-desc{color:var(--muted);font-size:12px}
.ac-item .ac-meta{color:var(--accent2);font-size:11px;font-variant-numeric:tabular-nums;margin-left:8px}

/* Totals box */
.totals{display:grid;grid-template-columns:auto auto;gap:8px 24px;justify-content:end;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);font-variant-numeric:tabular-nums}
.totals .lbl{color:var(--muted);text-align:right}
.totals .val{font-weight:500;text-align:right;min-width:120px}
.totals .grand .lbl,.totals .grand .val{font-size:16px;font-weight:700;color:var(--accent2);padding-top:6px;border-top:1px solid var(--border)}

/* Modal */
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal-wrap.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;width:520px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:16px;font-weight:700}
.modal-body{padding:20px 22px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:var(--panel);border:1px solid var(--accent);color:var(--text);padding:12px 18px;border-radius:8px;box-shadow:var(--shadow);z-index:300;font-size:13px;font-weight:500;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}

/* Misc */
.muted{color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.spacer{flex:1}
.tag{display:inline-block;padding:2px 7px;background:var(--panel2);border-radius:4px;font-size:11px;color:var(--muted);font-weight:500}

/* Print / PDF export */
@media print {
  body { background:#fff !important; color:#000 !important; }
  .app, .sidebar, .modal-wrap, .login-wrap, .toast, #print-only { display:none !important; }
  #print-area { display:block !important; }
}
#print-area{display:none}
.print-page{width:210mm;min-height:297mm;padding:18mm 16mm;margin:0 auto;background:#fff;color:#222;font-family:'Helvetica Neue',Arial,sans-serif;font-size:11pt;line-height:1.45;display:flex;flex-direction:column}
.print-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #ff7a2f;padding-bottom:14px;margin-bottom:18px}
.print-brand{font-size:30pt;font-weight:800;letter-spacing:-1px;color:#1a1a1a;line-height:1}
.print-tag{font-size:9pt;color:#666;margin-top:3px;letter-spacing:.5px}
.print-meta{text-align:right;font-size:9.5pt;color:#444}
.print-meta .pi{font-weight:700;color:#ff7a2f;font-size:13pt}
.print-section-title{font-size:9pt;color:#999;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:6px}
.print-cust{display:flex;justify-content:space-between;margin-bottom:18px;gap:30px}
.print-cust-block{flex:1}
.print-cust .name{font-size:13pt;font-weight:700;color:#1a1a1a;margin-bottom:3px}
.print-cust .addr{color:#555;font-size:10pt}
.print-tbl{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:9.5pt}
.print-tbl thead th{background:#1a1a1a;color:#fff;text-align:left;padding:8px 9px;font-size:9pt;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.print-tbl thead th.num{text-align:right}
.print-tbl tbody td{padding:9px 9px;border-bottom:1px solid #eee;vertical-align:top}
.print-tbl tbody td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.print-tbl tbody tr:nth-child(even){background:#fafafa}
.print-tbl .item-make{font-weight:600;color:#1a1a1a}
.print-tbl .item-desc{font-size:9pt;color:#666;margin-top:1px}
.print-tbl .item-code{font-size:8pt;color:#888;margin-top:1px}
.print-totals{margin-left:auto;width:280px;margin-bottom:18px}
.print-totals tr td{padding:5px 0;font-size:10pt}
.print-totals tr td:first-child{color:#666}
.print-totals tr td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.print-totals tr.grand td{font-size:13pt;font-weight:700;color:#ff7a2f;border-top:2px solid #1a1a1a;padding-top:8px}
.print-foot{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-top:22px;padding-top:14px;border-top:1px solid #ddd;font-size:9pt;color:#444}
.print-foot .lbl{font-weight:700;color:#1a1a1a;margin-bottom:3px;font-size:9.5pt}
.print-sign{margin-top:auto;display:flex;justify-content:flex-end;align-items:flex-end;padding-top:60px}
.print-sign-line{border-top:1px solid #999;width:200px;text-align:center;padding-top:5px;font-size:9pt;color:#666}
.print-thanks{font-size:10pt;color:#888;font-style:italic;text-align:center;margin-top:30px;padding-top:14px;border-top:1px solid #eee}
.print-foot .terms-line{padding-left:14px;text-indent:-14px;line-height:1.45}
.print-foot .bank-line{line-height:1.35;margin:0}
.merged-section{margin-bottom:14px;padding-bottom:10px;border-bottom:1px dashed #ccc}
.merged-section:last-of-type{border-bottom:none}
.merged-section-head{font-weight:700;color:#1a1a1a;margin:14px 0 8px;font-size:11pt;display:flex;justify-content:space-between;align-items:baseline;border-left:3px solid #ff7a2f;padding-left:10px}
.merged-section-head .meta{font-weight:400;color:#666;font-size:9.5pt}
.merged-grand{background:#fff8f0;border:2px solid #ff7a2f;padding:14px 22px;margin:18px 0;border-radius:4px;width:100%;border-collapse:collapse}
.merged-grand td{padding:5px 0;font-variant-numeric:tabular-nums}
.merged-grand td:first-child{color:#1a1a1a;font-weight:600;font-size:10pt}
.merged-grand td:last-child{text-align:right;font-weight:600;font-size:11pt;color:#1a1a1a}
.merged-grand tr.grand td{color:#ff7a2f;font-weight:700;font-size:11pt;text-transform:uppercase;letter-spacing:.5px;padding-bottom:8px;border-bottom:1px solid #ffd9b5}
.merged-grand tr.grand td:last-child{font-size:16pt;color:#1a1a1a;text-transform:none;letter-spacing:0}
.merged-grand tr.due td:last-child{color:#b45309}

/* Composite estimate — proforma-style print layout (A + B + C sections) */
.ce-title{text-align:center;font-weight:800;font-size:13.5pt;letter-spacing:1.2px;text-transform:uppercase;border:1px solid #333;padding:6px;background:#f2f2f2;color:#1a1a1a}
.ce-top{display:grid;grid-template-columns:1.25fr 1fr;border:1px solid #333;border-top:none;font-size:8.8pt;color:#333}
.ce-top .cell{padding:9px 11px}
.ce-top .cell + .cell{border-left:1px solid #333}
.ce-top .co-name{font-size:13pt;font-weight:800;color:#1a1a1a;letter-spacing:-.2px;line-height:1.1;margin-bottom:3px}
.ce-top .lbl{font-weight:700;color:#1a1a1a}
.ce-top .ln{line-height:1.4}
.ce-proj{border:1px solid #333;border-top:none;padding:8px 11px;font-size:12pt;font-weight:800;text-transform:uppercase;text-align:center;letter-spacing:.6px;color:#1a1a1a}
.ce-tbl{width:100%;border-collapse:collapse;font-size:8.8pt;margin-top:14px}
.ce-tbl th{background:#1a1a1a;color:#fff;border:1px solid #1a1a1a;padding:6px;font-size:8.2pt;font-weight:700;text-transform:uppercase;letter-spacing:.3px;text-align:center}
.ce-tbl td{border:1px solid #bbb;padding:5px 6px;vertical-align:top}
.ce-tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ce-tbl td.ctr{text-align:center}
.ce-tbl .it-make{font-weight:600;color:#1a1a1a}
.ce-tbl .it-desc{color:#666;font-size:8.2pt;margin-top:1px}
.ce-tbl tr.ce-sec td{background:#ededed;font-weight:800;text-transform:uppercase;color:#1a1a1a;font-size:9.5pt;letter-spacing:.4px;border-top:2px solid #1a1a1a}
.ce-tbl tr.ce-sub td{background:#fafafa;font-weight:700}
.ce-tbl tr.ce-sub td.lbl{text-align:right;text-transform:uppercase;letter-spacing:.4px;font-size:8.4pt;color:#444}
.ce-tbl tr.ce-note td{background:#fdece1;text-align:center;font-style:italic;color:#7a3b12}
.ce-tbl tr.ce-tot td{font-weight:700;background:#f6f6f6}
.ce-tbl tr.ce-disc td{font-weight:700;color:#b45309}
.ce-tbl tr.ce-grand td{background:#fff2e6;font-weight:800;font-size:12.5pt;color:#1a1a1a;border-top:2px solid #ff7a2f;border-bottom:2px solid #ff7a2f}
.ce-tbl tr{page-break-inside:avoid}
.ce-tbl tr.ce-sec{page-break-after:avoid}
.ce-boxes{display:grid;grid-template-columns:1.15fr 1fr;border:1px solid #333;margin-top:12px;font-size:8.8pt}
.ce-boxes .bx{padding:9px 11px}
.ce-boxes .bx + .bx{border-left:1px solid #333}
.ce-boxes .bx .lbl{font-weight:700;color:#1a1a1a;margin-bottom:4px;text-transform:uppercase;font-size:8.4pt;letter-spacing:.4px}
.ce-boxes .bx .ln{line-height:1.5}
.ce-note-box{font-weight:700;text-transform:uppercase;text-align:center;color:#1a1a1a;line-height:1.4}
.ce-terms{margin-top:12px;font-size:8.8pt;color:#333}
.ce-terms .hd{font-weight:800;color:#1a1a1a;text-decoration:underline;margin-bottom:5px;font-size:9.2pt}
.ce-terms .ln{padding-left:16px;text-indent:-16px;line-height:1.5}
.ce-contact{margin-top:10px;font-size:9pt;font-weight:700;color:#1a1a1a;line-height:1.5}
.ce-foot{margin-top:14px;border-top:1px solid #333;padding-top:6px;text-align:center;font-size:8.4pt;color:#666;font-style:italic}

/* Composite estimate builder (screen) */
.ce-sec-card{border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:10px;background:var(--panel2)}
.ce-sec-card .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ce-sec-card .meta{font-size:12px;color:var(--muted)}
.ce-sec-card.missing{border-color:var(--red);background:var(--red-dim)}
.ce-letter{width:28px;height:28px;border-radius:7px;background:var(--accent);color:#0b0e14;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.ce-pick-row{display:flex;gap:10px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px}
.ce-pick-row:last-child{border-bottom:none}
.ce-pick-row:hover{background:var(--panel2)}
.ce-pick-row .grow{flex:1;min-width:0}
.ce-pick-row .amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.print-watermark{position:absolute;bottom:8mm;left:0;right:0;text-align:center;font-size:8pt;color:#bbb;letter-spacing:1px}

/* responsive */
@media (max-width: 760px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:-260px;top:0;bottom:0;width:240px;transition:left .25s;z-index:100}
  .sidebar.open{left:0}
  .main{padding:18px}
  .form-grid{grid-template-columns:1fr}
  .mobile-menu-btn{display:inline-flex !important}
}
.mobile-menu-btn{display:none}
.project-stats{display:flex;flex-wrap:wrap;gap:14px 28px;margin:10px 0 20px;color:var(--muted)}
.project-stats b{color:var(--text);font-size:21px;margin-right:5px}
.project-notice{background:var(--accent-dim);border:1px solid #70401f;padding:13px 16px;border-radius:10px;margin-bottom:20px;color:#f7d8be;line-height:1.7}
.project-notice.subtle{background:transparent;border-color:var(--border);color:var(--muted);font-size:13px}
.project-filters{display:grid;grid-template-columns:minmax(240px,2fr) repeat(5,minmax(120px,1fr));gap:12px;margin-bottom:12px}
.project-filters label{color:var(--muted);font-size:12px;display:grid;gap:5px}
.project-filter-options{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:18px;align-items:center;color:var(--muted);font-size:12px}
.project-filter-options label,.project-check{display:flex;gap:7px;align-items:center}
.project-filter-options input,.project-check input{width:auto}
#projectResults{margin-left:auto}
.project-table-wrap{overflow-x:auto;padding:0}
.project-table-wrap>.card-head{padding:18px 20px 0}
.project-table{min-width:980px}
.project-table td{vertical-align:top;padding-top:15px;padding-bottom:15px}
.project-name{font-weight:650;text-align:left;color:var(--text);font-size:14px;max-width:330px}
.project-name:hover{color:var(--accent2);text-decoration:underline}
.project-meta{color:var(--muted);font-size:12px;margin-top:4px;white-space:normal}
.project-category{display:inline-block;padding:4px 9px;border-radius:30px;font-size:11px;white-space:nowrap;font-weight:650}
.project-category.fnb{color:#90e9d9;background:var(--green-dim)}
.project-category.non-fnb{color:#a8cdfa;background:var(--blue-dim)}
.project-review{display:inline-block;margin-top:6px;color:var(--amber);font-size:11px}
.project-footer{font-size:12px;color:var(--muted);padding:4px 0 24px;line-height:1.8}
.text-button{color:var(--accent2);text-decoration:underline;text-underline-offset:3px;text-align:left}
.project-client-links{margin-top:15px;line-height:2.7}
.project-work-list{margin:12px 0 0 20px;line-height:2}
.project-move{display:flex;gap:10px;margin-top:12px;align-items:center}
.project-move select{max-width:480px}
.project-form-error{color:#ffb4b4;min-height:18px;margin-top:12px}
.project-quote-link{margin-bottom:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
@media(max-width:1200px){.project-filters{grid-template-columns:1fr 1fr 1fr}.project-search{grid-column:1/-1}}
@media(max-width:520px){.project-filters{grid-template-columns:1fr}.project-stats{gap:12px}.project-stats b{font-size:18px}.project-filter-options{gap:12px}.project-move{flex-direction:column;align-items:stretch}.page-actions{flex-wrap:wrap}}

<script>
/* ================================================================
   TECH TOYS — QUOTATION APP
   Single-file web app. Data is synced live to Firebase Firestore cloud across all devices, with local fallback cache.
   ================================================================ */

const SEED_DATA = {"version": 1, "company": {"name": "Tech Toys", "default_terms": "Review the applicable quotation terms."}, "quotes": [], "clients": [], "products": [], "leads": [], "rentals": [], "estimates": [], "users": []};
const STORAGE_KEY = 'techToys_v1';
const BUILTIN_DEFAULT_TERMS = `· This quotation is valid for 30 days from date of issue.
· 50% advance, balance on delivery.
· Prices are inclusive of installation unless stated otherwise.`;
const SESSION_KEY = 'techToys_session';
const USER_KEY = 'techToys_currentUser';
const USER_ROLES = ['Admin','Staff'];


const PORTFOLIO_LOCAL_ONLY = false;
const PORTFOLIO_SOURCE = {"venues": []};
/* Pure, additive portfolio migration. Existing business records are never rewritten. */
const ProjectsCore = (() => {
  const normalize = value => String(value || '').normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
  const clone = value => JSON.parse(JSON.stringify(value));
  const types = ['F&B venue','Bar','Pub','Club','Restaurant','Hotel','Hospital','Lounge','Cafe','Unspecified'];
  const stages = ['Completed','In progress','Planned','Not recorded'];
  function validate(db) {
    if (!db || !Array.isArray(db.quotes) || !Array.isArray(db.products)) throw new Error('A backup needs quotation and product arrays.');
    if (db.clients !== undefined && !Array.isArray(db.clients)) throw new Error('Invalid client records.');
    if (db.portfolio !== undefined && (!db.portfolio || db.portfolio.version !== 1 || !Array.isArray(db.portfolio.projects) || !db.portfolio.quote_links || !db.portfolio.work_links)) throw new Error('Unrecognized Projects data. Keep the original backup and use a compatible app.');
    for (const key of ['quotes','clients','products']) {
      const rows = db[key] || [];
      if (rows.some(r => !r || typeof r !== 'object' || typeof r.id !== 'string' || !r.id)) throw new Error(`Invalid ${key} identifiers.`);
      if (new Set(rows.map(r => r.id)).size !== rows.length) throw new Error(`Duplicate ${key} identifiers; import stopped to preserve relationships.`);
    }
    if (db.quotes.some(q => !Array.isArray(q.items))) throw new Error('Invalid quotation line items.');
    if (db.portfolio) {
      const ids = db.portfolio.projects.map(p => p.id);
      if (new Set(ids).size !== ids.length || ids.some(id => typeof id !== 'string' || !id)) throw new Error('Invalid project identifiers.');
    }
    return db;
  }
  const workKey = (clientKey, work) => JSON.stringify([clientKey, normalize(work)]);
  const get = (db, id) => db.portfolio.projects.find(p => p.id === id);
  function nextId(portfolio) {
    let n = 1;
    while (portfolio.projects.some(p => p.id === `PRJ${String(n).padStart(4,'0')}`)) n++;
    return `PRJ${String(n).padStart(4,'0')}`;
  }
  function matches(p, name) { return !!normalize(name) && [p.name,...(p.aliases || [])].some(x => normalize(x) === normalize(name)); }
  function matchName(portfolio, name) {
    const found = portfolio.projects.filter(p => matches(p, name));
    return found.length === 1 ? found[0] : null;
  }
  function ensure(db, source, now = new Date().toISOString()) {
    validate(db);
    const before = JSON.stringify(db.portfolio);
    if (!db.portfolio) db.portfolio = {version:1, projects:[], quote_links:{}, work_links:{}, imports:[], created:now};
    const reg = db.portfolio;
    reg.quote_links = Object.assign(Object.create(null),reg.quote_links);
    reg.work_links = Object.assign(Object.create(null),reg.work_links);
    if (!Array.isArray(reg.imports)) reg.imports = [];
    const sourceId = 'completed-fnb-2026-09-14';
    if(!source.venues.length && !reg.imports.includes(sourceId)){
      // A public code build contains no private portfolio. Do not classify
      // customer work as absent from a list that has not been loaded.
      classifyClients(db);
      return before !== JSON.stringify(reg);
    }
    if (!reg.imports.includes(sourceId)) {
      source.venues.forEach((v, index) => {
        const sid = `${sourceId}:${index + 1}`;
        let p = reg.projects.find(x => x.source_id === sid) || matchName(reg, v.name);
        if (!p) {
          p = {id:nextId(reg),name:v.name,category:'F&B',type:v.type || 'F&B venue',completion:'Completed',aliases:clone(v.aliases || []),notes:v.note || '',review_note:v.review || '',source_id:sid,source_column:v.column,origin:'Completed portfolio',created:now,updated:now};
          reg.projects.push(p);
        } else {
          p.source_id = sid;
          p.category = 'F&B'; p.completion = 'Completed';
          p.aliases = [...new Set([...(p.aliases || []),...(v.aliases || [])])];
        }
      });
      reg.imports.push(sourceId);
    }
    // Correct only the exact earlier transcription; retain any user-edited name.
    const correctedBar = reg.projects.find(p=>p.source_id===`${sourceId}:4` && p.name==='Rais the Bar');
    if(correctedBar){correctedBar.name='Raise the Bar';correctedBar.aliases=[...new Set([...(correctedBar.aliases||[]),'Rais the Bar'])];}
    function resolve(client, work, quote) {
      const clientName = client?.name || quote?.client || '';
      const clientKey = client?.id || `unlinked:${normalize(clientName)}`;
      const key = workKey(clientKey, work);
      const prior = get(db, reg.work_links[key]);
      if (prior) return prior;
      let project = matchName(reg, work) || matchName(reg, clientName);
      const family = /^(desilane)(?:new|change)?$/.test(normalize(clientName)) ? 'Desi Lane' : /^(kgf)(?:new)?$/.test(normalize(clientName)) ? 'KGF' : '';
      if (!project && family) {
        project = reg.projects.find(p => p.family === family && p.outlet_unassigned);
        if (!project) {
          project = {id:nextId(reg),name:`${family} — outlet unassigned`,family,outlet_unassigned:true,category:'F&B',type:'F&B venue',completion:'Not recorded',aliases:[],notes:'The user confirmed work at every listed outlet. These older quotation records do not identify an outlet; use Move linked work to assign them when known.',review_note:'Assign the existing work to the correct outlet.',origin:'Existing quoted work',created:now,updated:now};
          reg.projects.push(project);
        }
      }
      if (!project) {
        const name = clientName ? (work ? `${clientName} — ${work}` : clientName) : (work || `Unnamed quotation ${quote?.id || ''}`);
        project = {id:nextId(reg),name,category:'Non-F&B',type:/hospital|^disha\b/i.test(clientName) ? 'Hospital' : 'Unspecified',completion:'Not recorded',aliases:[],notes:'Existing project absent from the completed F&B list. Completion has not been inferred from quotation or payment status.',review_note:'',origin:'Existing quoted work',created:now,updated:now};
        reg.projects.push(project);
      }
      reg.work_links[key] = project.id;
      return project;
    }
    for (const q of db.quotes) {
      const client = (db.clients || []).find(c => c.id === q.client_id) || (!q.client_id ? (db.clients || []).find(c => normalize(c.name) === normalize(q.client)) : null);
      const linked = get(db, reg.quote_links[q.id]);
      if (linked) {
        const key = workKey(client?.id || `unlinked:${normalize(q.client)}`, q.project_name || '');
        if (!reg.work_links[key]) reg.work_links[key] = linked.id;
      } else reg.quote_links[q.id] = resolve(client,q.project_name || '',q).id;
    }
    for (const c of db.clients || []) for (const name of c.projects || []) {
      if (typeof name === 'string' && name.trim()) resolve(c,name,null);
    }
    classifyClients(db);
    return before !== JSON.stringify(reg);
  }
  function classifyClients(db) {
    const reg=db.portfolio;
    if(!reg.client_classifications)reg.client_classifications={};
    const associations=new Map((db.clients||[]).map(c=>[c.id,new Set()]));
    for(const q of db.quotes){if(associations.has(q.client_id))associations.get(q.client_id).add(reg.quote_links[q.id]);}
    for(const c of db.clients||[])for(const work of c.projects||[])associations.get(c.id).add(reg.work_links[workKey(c.id,work)]);
    for(const p of reg.projects)for(const id of p.client_ids||[])if(associations.has(id))associations.get(id).add(p.id);
    for(const c of db.clients||[]){
      if(reg.client_classifications[c.id]?.override)continue;
      const ps=[...associations.get(c.id)].map(id=>get(db,id)).filter(Boolean);
      const direct=matchName(reg,c.name);
      const family=/^(desilane|kgf)(?:new|change)?$/.test(normalize(c.name));
      const categories=new Set(ps.map(p=>p.category));
      if(direct)categories.add(direct.category);
      if(family)categories.add('F&B');
      const mixed=categories.size>1;
      const missingPortfolio=!reg.imports.includes('completed-fnb-2026-09-14') && categories.size===0;
      const category=(mixed||missingPortfolio)?'Needs review':categories.has('F&B')?'F&B':'Non-F&B';
      const knownTypes=[...new Set(ps.map(p=>p.type).filter(t=>t && !['Unspecified','F&B venue'].includes(t)))];
      const type=/hospital|^disha\b/i.test(c.name)?'Hospital':direct?.type || (knownTypes.length===1?knownTypes[0]:category==='F&B'?'F&B venue':'Unspecified');
      reg.client_classifications[c.id]={category,type,basis:mixed?'This billing client links to both F&B and non-F&B work; review the client category.':(direct?.category==='F&B'||family)?'Matched to the completed F&B portfolio by name or confirmed outlet family.':category==='F&B'?'Matched through linked quotation/project work.':'Absent from the completed F&B portfolio.',override:false,review_note:mixed?'Multiple project categories are linked to this client.':''};
      if(missingPortfolio){reg.client_classifications[c.id].basis='The completed portfolio has not been loaded on this device.';reg.client_classifications[c.id].review_note='Load your private portfolio to classify this client.';}
    }
  }
  function quotes(db, id) { return db.quotes.filter(q => db.portfolio.quote_links[q.id] === id); }
  function works(db, id) {
    const out = [];
    for (const c of db.clients || []) for (const name of c.projects || []) {
      if (db.portfolio.work_links[workKey(c.id,name)] === id) out.push({client:c,name});
    }
    return out;
  }
  function clients(db, id) {
    const ids = new Set(quotes(db,id).map(q => q.client_id).filter(Boolean));
    works(db,id).forEach(w => ids.add(w.client.id));
    (get(db,id)?.client_ids || []).forEach(cid => ids.add(cid));
    return (db.clients || []).filter(c => ids.has(c.id));
  }
  function moveLinks(db, from, to) {
    if (!get(db,from) || !get(db,to) || from === to) throw new Error('Choose a different existing project.');
    for (const [qid,pid] of Object.entries(db.portfolio.quote_links)) if (pid === from) db.portfolio.quote_links[qid] = to;
    for (const [key,pid] of Object.entries(db.portfolio.work_links)) if (pid === from) db.portfolio.work_links[key] = to;
    const dest = get(db,to), src = get(db,from);
    dest.client_ids = [...new Set([...(dest.client_ids || []),...(src.client_ids || [])])];
    if (src.outlet_unassigned) { src.archived = true; src.review_note = ''; }
  }
  return {normalize,clone,types,stages,validate,ensure,get,nextId,matches,matchName,quotes,works,clients,moveLinks,workKey,classifyClients};
})();
if (typeof module !== 'undefined') module.exports = ProjectsCore;

/* Included inline in the distributable HTML so the app also works from a local file. */
const PROJECTS_BACKUP_PREFIX = 'techToys_beforeProjects_';
let projectsFilter = {search:'',category:'',type:'',completion:'',city:'',year:'',review:false,archived:false};
function projectStorageBackup(raw, reason = 'migration') {
  if (!raw) return;
  const key = PROJECTS_BACKUP_PREFIX + new Date().toISOString() + '_' + reason;
  localStorage.setItem(key,raw);
  if (localStorage.getItem(key) !== raw) throw new Error('The safety backup could not be saved. Free browser storage or export your current data before continuing.');
  return key;
}
function ensureProjectMigration(db, raw) {
  ProjectsCore.validate(db);
  if (!db.portfolio?.imports?.includes('completed-fnb-2026-09-14')) projectStorageBackup(raw || JSON.stringify(db));
  return ProjectsCore.ensure(db, PORTFOLIO_SOURCE);
}
function projectEscape(value) { return escapeHTML(value); }
async function importPrivatePortfolio(input){
  const file=input.files?.[0];if(!file)return;
  try{
    const pack=JSON.parse(await file.text());
    if(pack.format!=='tech-toys-portfolio-v1' || !pack.portfolio)throw new Error('Choose the private portfolio file supplied with this update.');
    const next=ProjectsCore.clone(DB),incoming=ProjectsCore.clone(pack.portfolio);
    ProjectsCore.validate({...next,portfolio:incoming});
    projectStorageBackup(JSON.stringify(DB),'before-portfolio-import');
    const existing=next.portfolio;
    if(existing?.imports?.includes('completed-fnb-2026-09-14'))throw new Error('The completed portfolio is already loaded. Your current edits have been retained.');
    // Retain existing manually created projects and avoid colliding IDs.
    const remap={};
    for(const p of existing?.projects||[]){let id=p.id;while(incoming.projects.some(x=>x.id===id))id='LOCAL_'+id;remap[p.id]=id;incoming.projects.push({...p,id});}
    for(const [id,link] of Object.entries(incoming.quote_links)){
      const quote=next.quotes.find(q=>q.id===id),identity=pack.quote_identity?.[id];
      if(!quote || !identity || JSON.stringify([quote.client_id||'',quote.client||'',quote.project_name||''])!==JSON.stringify(identity))delete incoming.quote_links[id];
    }
    for(const key of Object.keys(incoming.work_links)){
      let pair;try{pair=JSON.parse(key);}catch{delete incoming.work_links[key];continue;}
      const client=(next.clients||[]).find(c=>c.id===pair[0]);if(!client || pack.client_identity?.[client.id]!==client.name)delete incoming.work_links[key];
    }
    for(const [qid,pid] of Object.entries(existing?.quote_links||{}))if(remap[pid])incoming.quote_links[qid]=remap[pid];
    for(const [key,pid] of Object.entries(existing?.work_links||{}))if(remap[pid])incoming.work_links[key]=remap[pid];
    incoming.client_classifications={};incoming.data_origin='private-portfolio';
    next.portfolio=incoming;ProjectsCore.ensure(next,PORTFOLIO_SOURCE);
    DB=next;saveDB();renderProjects();toast('Portfolio saved on this device and queued for private cloud sync');
  }catch(err){alert('Portfolio was not loaded: '+err.message);}
}
function projectAction(id, action = 'view') { return `data-project-action="${action}" data-project-id="${projectEscape(id)}"`; }
function projectButton(id,label,action='view',cls='btn btn-sm') { return `<button class="${cls}" ${projectAction(id,action)}>${label}</button>`; }
function bindProjectActions(root=document.getElementById('mainView')) {
  root.querySelectorAll('[data-project-action]').forEach(el => el.onclick = () => {
    const id=el.dataset.projectId;
    if(el.dataset.projectAction==='edit') editPortfolioProject(id);
    else if(el.dataset.projectAction==='quote') newQuoteForProject(id);
    else navigate('project',id);
  });
}
function projectSelect(options,value) { return options.map(v=>`<option value="${projectEscape(v)}" ${v===value?'selected':''}>${projectEscape(v || 'All')}</option>`).join(''); }
function projectFieldOptions(field,sorter) {
  return [...new Set(DB.portfolio.projects.map(p=>String(p[field]||'').trim()).filter(Boolean))].sort(sorter);
}
function projectPill(p) { return `<span class="project-category ${p.category==='F&B'?'fnb':'non-fnb'}">${projectEscape(p.category)}</span>`; }
function completedPortfolioPresent(db){
  return !!(db?.portfolio?.imports?.includes('completed-fnb-2026-09-14') && db.portfolio.projects?.length);
}
function portfolioNoticeState(){
  if(!AUTH_OWNER||!CLOUD_READY||CLOUD_LOADING||!SYNC_BASE)return 'checking';
  if(completedPortfolioPresent(SYNC_BASE))return 'cloud';
  if(SYNC_CONFLICT)return 'review';
  if(completedPortfolioPresent(DB))return 'pending';
  return 'missing';
}
function projectDataNote() {
  const state=portfolioNoticeState(),messages={checking:'Checking your private cloud portfolio…',review:'Portfolio sync needs review. Both saved copies are retained; resolve the sync notice to continue.',pending:'Your completed portfolio is saved on this device. Waiting for private cloud sync.'};
  if(state==='cloud')return '';
  if(messages[state])return `<div id="portfolioSyncNotice" class="project-notice" data-state="${state}" role="status">${messages[state]}</div>`;
  // Only a confirmed cloud read with no saved completed portfolio offers import.
  return '<div id="portfolioSyncNotice" class="project-notice" data-state="missing">Your completed portfolio is not in the private cloud yet. <button class="text-button" onclick="document.getElementById(\'privatePortfolioFile\').click()">Load portfolio</button><input id="privatePortfolioFile" type="file" accept="application/json,.json" hidden onchange="importPrivatePortfolio(this)"></div>';
}
function refreshPortfolioNotice(){
  const notice=document.getElementById('portfolioSyncNotice');
  if(notice&&notice.dataset.state!==portfolioNoticeState())notice.outerHTML=projectDataNote();
}


function renderProjects() {
  const ps=DB.portfolio.projects;
  const visible=ps.filter(p=>!p.archived);
  document.getElementById('mainView').innerHTML=`
    <div class="page-head"><div><button class="btn btn-icon mobile-menu-btn" onclick="toggleSidebar()" aria-label="Open navigation">☰</button><div class="page-title">Projects</div><div class="page-sub">Your venues and project work, across all years</div></div>
    <div class="page-actions"><button class="btn" onclick="exportProjectsCSV()">Export list</button><button class="btn btn-primary" onclick="editPortfolioProject()">+ Add project</button></div></div>
    ${projectDataNote()}
    <div class="project-stats"><span><b>${visible.length}</b> projects</span><span><b>${visible.filter(p=>p.category==='F&B' && p.completion==='Completed').length}</b> completed F&amp;B venues</span><span><b>${visible.filter(p=>p.category==='Non-F&B').length}</b> non-F&amp;B</span><span><b>${visible.filter(p=>p.review_note).length}</b> to review</span></div>
    <div class="project-notice subtle">Your uploaded portfolio is F&amp;B, including hotels. Other existing projects are non-F&amp;B. Quotation status and project completion are kept separately.</div>
    <div class="project-filters"><label class="project-search">Search<input id="projectSearch" type="search" placeholder="Venue, city, year, client, work or alias" value="${projectEscape(projectsFilter.search)}"></label>
    <label>Category<select id="projectCategory">${projectSelect(['','F&B','Non-F&B'],projectsFilter.category)}</select></label>
    <label>Venue type<select id="projectType">${projectSelect(['',...ProjectsCore.types],projectsFilter.type)}</select></label>

async function saveAndPrintQuote(){

  const started=performance.now();
  try{
    const id=saveQuote(true);
    if(!id)return;
    const saveMs=performance.now()-started;

/* Three-way merging for the existing database. Conflicts never discard either copy. */
const SecureMerge = (() => {
  const copy = value => value === undefined ? undefined : JSON.parse(JSON.stringify(value));
  const object = value => value !== null && typeof value === 'object' && !Array.isArray(value);
  function equal(a,b) {
    if(a===b)return true;
    if(Array.isArray(a)&&Array.isArray(b))return a.length===b.length&&a.every((v,i)=>equal(v,b[i]));
    if(object(a)&&object(b))return Object.keys(a).length===Object.keys(b).length&&Object.keys(a).every(k=>Object.hasOwn(b,k)&&equal(a[k],b[k]));
    return false;
  }
  const idRows = rows => Array.isArray(rows) && rows.every(r=>object(r)&&typeof r.id==='string'&&r.id) && new Set(rows.map(r=>r.id)).size===rows.length;
  function merge(base,local,remote) {
    const conflicts=[];
    function walk(b,l,r,path) {
      if(equal(l,r))return copy(l);
      if(equal(l,b))return copy(r);
      if(equal(r,b))return copy(l);
      // Bookkeeping timestamps do not represent competing business edits.
      if(path==='updated'||path==='portfolio.updated')return [l,r].filter(v=>typeof v==='string').sort().at(-1);
      if(path==='portfolio.data_origin')return 'cloud';
      if(path==='portfolio.imports'&&[b,l,r].every(Array.isArray))return [...new Set([...l,...r])];
      if(object(b)&&object(l)&&object(r)) {
        const result={};
        for(const k of new Set([...Object.keys(b),...Object.keys(l),...Object.keys(r)])) {
          if(['__proto__','constructor','prototype'].includes(k))throw new Error('Unsupported record key. Original data retained.');
          const value=walk(b[k],l[k],r[k],path?`${path}.${k}`:k);
          if(value!==undefined)result[k]=value;
        }
        return result;
      }
      if([b,l,r].every(idRows)) {
        const bm=new Map(b.map(v=>[v.id,v])),lm=new Map(l.map(v=>[v.id,v])),rm=new Map(r.map(v=>[v.id,v]));
        const result=[];
        // Preserve server ordering and append genuinely new local records.
        for(const id of new Set([...r.map(v=>v.id),...l.map(v=>v.id),...b.map(v=>v.id)])) {
          const value=walk(bm.get(id),lm.get(id),rm.get(id),`${path}[${id}]`);
          if(value!==undefined)result.push(value);
        }
        return result;
      }
      conflicts.push(path||'database');
      return copy(l);
    }
    const value=walk(base,local,remote,'');
    return {value,conflicts};
  }
  // No shared ancestor exists on the first secure launch. Keep every server
  // record authoritative and save divergent local records for explicit review.
  function firstConnect(local,remote) {
    const value=copy(remote), conflicts=[];
    if(!local)return {value,conflicts};
    for(const key of ['quotes','clients','products','rentals','leads','estimates']) {
      for(const row of local[key]||[]) {
        const current=(remote[key]||[]).find(r=>r.id===row.id);
        if(!current||!equal(row,current))conflicts.push(`${key}[${row.id}]`);
      }
    }
    if(local.portfolio?.projects?.length && !remote.portfolio?.projects?.length) {
      value.portfolio=copy(local.portfolio);
      // Identity checks prevent old quote links being applied to reused IDs.
      for(const [id] of Object.entries(value.portfolio.quote_links||{})) {
        const l=(local.quotes||[]).find(q=>q.id===id),r=(remote.quotes||[]).find(q=>q.id===id);
        if(!l||!r||!equal([l.client_id,l.client,l.project_name],[r.client_id,r.client,r.project_name]))delete value.portfolio.quote_links[id];
      }
      for(const [key] of Object.entries(value.portfolio.work_links||{})) {
        let id;try{[id]=JSON.parse(key);}catch{delete value.portfolio.work_links[key];continue;}

async function initCloudSync() {

  SYNC_CONFLICT=null;

  if(epoch!==AUTH_EPOCH)return;
  if(!first.exists||!first.data()?.db){CLOUD_LOADING=false;throw new Error('Existing database unavailable');}
  const remote=syncCopy(first.data().db);ProjectsCore.validate(remote);
  syncBackup(remote,'before-secure-sync-cloud');if(DB)syncBackup(DB,'before-secure-sync-device');
  const local=syncCopy(DB);
  const result=SYNC_BASE&&DB?SecureMerge.merge(SYNC_BASE,DB,remote):SecureMerge.firstConnect(DB,remote);
  SYNC_REVISION=first.data().revision||0;
  SYNC_BASE=syncCopy(remote);CLOUD_LOADING=false;CLOUD_READY=true;
  // On first-connection differences, do not silently choose a record winner.
  applySyncedDB(result.conflicts.length?remote:result.value,false);

  if(result.conflicts.length)syncProblem(local,remote,result.conflicts,true);
  else cloudStatusText('Owner-only cloud sync active');
  SYNC_ACCESS_UNSUB=CLOUD_DB.collection('appAccess').doc(uid).onSnapshot(doc=>{
    if(epoch!==AUTH_EPOCH||doc.metadata?.fromCache)return;
    if(!doc.exists||doc.data().role!=='owner'||doc.data().active!==true)revokeOwnerView();
  },()=>{if(epoch===AUTH_EPOCH)revokeOwnerView();});
  SYNC_ON_SNAPSHOT=doc=>{
    if(epoch!==AUTH_EPOCH||doc.metadata?.hasPendingWrites||doc.metadata?.fromCache||!CLOUD_READY)return;
    if(!doc.exists||!doc.data()?.db){cloudStatusText('Cloud database unavailable · local copy retained');return;}
    if((doc.data().revision||0)<SYNC_REVISION)return;
    if(SYNC_SAVING){SYNC_DEFERRED=doc;return;}
    try {
      const latest=syncCopy(doc.data().db);ProjectsCore.validate(latest);
      if(SYNC_CONFLICT){SYNC_CONFLICT.remote=latest;return;}
      const merged=SecureMerge.merge(SYNC_BASE,DB,latest);
      if(merged.conflicts.length){syncProblem(DB,latest,merged.conflicts);return;}
      SYNC_BASE=latest;SYNC_REVISION=doc.data().revision||0;

  };

    if(epoch!==AUTH_EPOCH)return;
    if(error.code==='permission-denied'||error.code==='unauthenticated')revokeOwnerView();
    else cloudStatusText('Offline · changes retained on this device');

function revokeOwnerView() {

function queueCloudSave(immediate=false) {

async function flushOwnerSave() {
  if(!AUTH_OWNER||!CLOUD_READY||SYNC_SAVING||SYNC_CONFLICT||!SYNC_DIRTY)return;
  const epoch=AUTH_EPOCH,base=syncCopy(SYNC_BASE),local=syncCopy(DB);let successful=false;
  const ref=CLOUD_DB.collection(CLOUD_COLLECTION).doc(CLOUD_DOC);
  SYNC_SAVING=true;
  try {
    const committed=await CLOUD_DB.runTransaction(async transaction=>{
      if(epoch!==AUTH_EPOCH||!AUTH_OWNER)throw new Error('Signed out');
      const current=await transaction.get(ref);
      if(!current.exists||!current.data()?.db)throw new Error('Existing database missing');
      const remote=syncCopy(current.data().db);ProjectsCore.validate(remote);
      const merged=SecureMerge.merge(base,local,remote);
      if(merged.conflicts.length){const error=new Error('Overlapping changes');error.conflict={remote,paths:merged.conflicts};throw error;}
      // A lost network response may cause a retry after the server committed.
      if(SecureMerge.equal(merged.value,remote))return {db:remote,revision:current.data().revision||0};
      ProjectsCore.validate(merged.value);
      const revision=(current.data().revision||0)+1;
      transaction.update(ref,{db:merged.value,updated:firebase.firestore.FieldValue.serverTimestamp(),updated_iso:merged.value.updated||new Date().toISOString(),revision});
      return {db:merged.value,revision};
    });

    successful=true;
    const later=SecureMerge.merge(local,DB,committed.db);
    SYNC_BASE=syncCopy(committed.db);SYNC_REVISION=committed.revision;
    if(later.conflicts.length){syncProblem(DB,committed.db,later.conflicts);return;}
    applySyncedDB(later.value);SYNC_DIRTY=!SecureMerge.equal(DB,SYNC_BASE);syncState();
    cloudStatusText(SYNC_DIRTY?'Newer edits saved on device · syncing…':'Saved to your private cloud');
  }catch(error){
    if(epoch!==AUTH_EPOCH)return;
    if(error.conflict)syncProblem(DB,error.conflict.remote,error.conflict.paths);
    else if(error.code==='permission-denied'||error.code==='unauthenticated')revokeOwnerView();
    else cloudStatusText('Sync unavailable · changes retained on this device');
  }finally{
    SYNC_SAVING=false;
    if(SYNC_DEFERRED&&SYNC_ON_SNAPSHOT){const deferred=SYNC_DEFERRED;SYNC_DEFERRED=null;SYNC_ON_SNAPSHOT(deferred);}
    // Retry only on a new edit or an online/snapshot event after a failure.
  }
  if(successful&&epoch===AUTH_EPOCH&&SYNC_DIRTY&&!SYNC_CONFLICT&&AUTH_OWNER) {
    // A new edit made during a successful transaction needs its own commit.
    if(!SecureMerge.equal(local,DB))queueCloudSave();
  }
}

/* -------- Snapshots (versioned saves) -------- */
const SNAPSHOTS_KEY = 'techToys_snapshots';
const SNAPSHOT_CAP = 20;

function loadSnapshots(){
  try { return JSON.parse(localStorage.getItem(SNAPSHOTS_KEY) || '[]'); }
  catch(e){ return []; }
}
function persistSnapshots(arr){
  // Trim to cap (keep newest)
  arr.sort((a,b)=>b.created.localeCompare(a.created));
  if(arr.length > SNAPSHOT_CAP) arr = arr.slice(0, SNAPSHOT_CAP);
  try {
    localStorage.setItem(SNAPSHOTS_KEY, JSON.stringify(arr));
  } catch(e){
    // QuotaExceeded — drop oldest until it fits
    while(arr.length > 1){
      arr.pop();
      try { localStorage.setItem(SNAPSHOTS_KEY, JSON.stringify(arr)); return arr; }
      catch(e2){}
    }
    throw e;
  }
  return arr;
}
function snapshotSummary(db){
  const totalValue = (db.quotes||[]).reduce((s,q)=>{
    const sub = (q.items||[]).reduce((a,it)=>a+(it.qty||0)*(it.price||0),0);
    const aft = Math.max(0, sub - (q.discount||0));
    return s + aft + aft*((q.tax_pct||0)/100);
  }, 0);
  return {
    quotes: (db.quotes||[]).length,
    clients: (db.clients||[]).length,
    products: (db.products||[]).length,
    totalValue,
  };
}
function addSnapshot(label, auto){
  const snaps = loadSnapshots();
  const snap = {
    id: 'S' + Date.now(),
    created: new Date().toISOString(),
    label: label || (auto ? 'Auto-save' : 'Manual save'),
    auto: !!auto,
    summary: snapshotSummary(DB),
    data: JSON.parse(JSON.stringify(DB)),
  };
  snaps.unshift(snap);
  persistSnapshots(snaps);
  try{ localStorage.setItem(LAST_SNAP_DATE_KEY, snap.created.slice(0,10)); }catch(e){}
  return snap;
}
function deleteSnapshot(id){
  const snaps = loadSnapshots().filter(s=>s.id!==id);
  persistSnapshots(snaps);
}
function restoreSnapshot(id){
  const snaps = loadSnapshots();
  const snap = snaps.find(s=>s.id===id);
  if(!snap) return false;
  // Save a "pre-restore" snapshot so the action is undoable
  addSnapshot(`Pre-restore safety (before loading ${fmtSnapshotDate(snap.created)})`, true);
  DB = JSON.parse(JSON.stringify(snap.data));
  // Don't trigger another auto-snapshot from the save below
  _suppressAutoSnap = true;
  saveDB();
  _suppressAutoSnap = false;
  return true;
}
function lastSnapshot(){
  const snaps = loadSnapshots();
  return snaps[0] || null;
}
let _suppressAutoSnap = false;
const LAST_SNAP_DATE_KEY = 'techToys_lastSnapDate';
function maybeAutoSnapshot(){
  if(_suppressAutoSnap) return;
  const todayStr = new Date().toISOString().slice(0,10);
  // Cheap date-key check first — parsing the full snapshot store (up to 20
  // deep copies of DB) on every save froze the UI, worst on mobile.
  let lastDate = localStorage.getItem(LAST_SNAP_DATE_KEY);
  if(!lastDate){
    const last = lastSnapshot();
    lastDate = last ? last.created.slice(0,10) : '';
    if(lastDate) try{ localStorage.setItem(LAST_SNAP_DATE_KEY, lastDate); }catch(e){}
  }
  // Auto-snapshot once per calendar day
  if(lastDate !== todayStr){
    try { addSnapshot('Auto-save (first edit of the day)', true); }
    catch(e){ console.warn('snapshot failed', e); }
  }
}
function fmtSnapshotDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleString('en-IN', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
}
function fmtRelativeTime(iso){
  if(!iso) return 'never';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  const ms = Date.now() - d.getTime();
  const min = Math.round(ms/60000);
  if(min < 1) return 'just now';
  if(min < 60) return `${min} min ago`;
  const hr = Math.round(min/60);
  if(hr < 24) return `${hr} hr ago`;
  const day = Math.round(hr/24);
  if(day === 1) return 'yesterday';
  if(day < 7) return `${day} days ago`;
  return d.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
}

function manualSaveSnapshot(){
  const label = prompt('Optional label for this snapshot (e.g. "End of week", "Before client cleanup"):', '');
  if(label === null) return; // cancelled
  // Suppress the auto-snapshot side-effect from any saveDB call during this action
  _suppressAutoSnap = true;
  try {
    const snap = addSnapshot(label.trim() || 'Manual save', false);
    toast(`Snapshot saved: ${fmtSnapshotDate(snap.created)}`);
  } finally {
    _suppressAutoSnap = false;
  }

  else if(CURRENT_VIEW==='dashboard') renderDashboard();

function confirmRestoreSnapshot(id){

    + `This will replace your current data:\n`
    + `  Quotes:   ${(DB.quotes||[]).length} → ${snap.summary.quotes}\n`
    + `  Clients:  ${(DB.clients||[]).length} → ${snap.summary.clients}\n`
    + `  Products: ${(DB.products||[]).length} → ${snap.summary.products}\n\n`

function confirmDeleteSnapshot(id){

/* -------- Financial Year filter (global) -------- */
const FY_KEY = 'techToys_fy';
let CURRENT_FY = localStorage.getItem(FY_KEY) || 'current';

function quoteFY(q){
  if(!q || !q.date) return null;
  const d = new Date(q.date);
  if(isNaN(d)) return null;
  const y = d.getFullYear(), m = d.getMonth(); // m: 0=Jan
  const fyStart = m >= 3 ? y : y - 1; // April (3) onwards = current FY; Jan-Mar = previous
  return `FY ${fyStart}-${String(fyStart+1).slice(-2)}`;
}
function currentFY(){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const fyStart = m >= 3 ? y : y - 1;
  return `FY ${fyStart}-${String(fyStart+1).slice(-2)}`;
}
function activeFY(){
  return CURRENT_FY === 'current' ? currentFY() : CURRENT_FY;
}
function listAvailableFYs(){
  const fys = new Set();
  (DB && DB.quotes ? DB.quotes : []).forEach(q=>{ const f = quoteFY(q); if(f) fys.add(f); });
  fys.add(currentFY()); // always include current FY even if no quotes
  return Array.from(fys).sort().reverse();
}
function filterQuotesByFY(quotes){
  if(CURRENT_FY === 'all') return quotes;
  const target = activeFY();
  return quotes.filter(q => quoteFY(q) === target);
}
function changeFY(val){
  CURRENT_FY = val;
  localStorage.setItem(FY_KEY, val);
  renderFYSelector();
  // Re-render whichever filterable view we're on
  if(CURRENT_VIEW==='dashboard') renderDashboard();
  else if(CURRENT_VIEW==='quotes') renderQuotes();
  else if(CURRENT_VIEW==='estimates') renderEstimates();
  else if(CURRENT_VIEW==='clients') renderClients();
  else if(CURRENT_VIEW==='client') {
    const id = (location.hash.split('/')[1])||'';
    if(id) renderClientDetail(id);
  }
}
function renderFYSelector(){
  const wrap = document.getElementById('fySelectorWrap');
  if(!wrap) return;
  const fys = listAvailableFYs();
  const sel = CURRENT_FY;
  wrap.innerHTML = `
    <label>Financial Year</label>
    <select id="fySelect" onchange="changeFY(this.value)">
      <option value="current" ${sel==='current'?'selected':''}>Current (${currentFY()})</option>
      <option value="all" ${sel==='all'?'selected':''}>All Time</option>
      <option disabled>──────────</option>
      ${fys.map(f=>`<option value="${f}" ${sel===f?'selected':''}>${f}</option>`).join('')}
    </select>
  `;
}
function fyLabel(){

  return AUTH.signInWithEmailAndPassword(email.trim(),password);
}
function ownerHasEmailPassword(){return !!AUTH?.currentUser?.providerData.some(p=>p.providerId==='password');}
function closeOwnerEmailSetup(){
  for(const id of ['ownerNewPassword','ownerConfirmPassword']){const el=document.getElementById(id);if(el)el.value='';}

}
function openOwnerEmailSetup(){
  if(!AUTH_OWNER||AUTH?.currentUser?.uid!==AUTH_OWNER.uid||!AUTH.currentUser.emailVerified)return;
  if(ownerHasEmailPassword()){toast('Email sign-in is already linked to your owner account.');return;}
  openModal(`<div class="modal-head"><div class="modal-title">Add email sign-in</div><button class="btn btn-icon" onclick="closeOwnerEmailSetup()" aria-label="Close password setup">×</button></div>
    <form id="ownerEmailSetupForm"><div class="modal-body"><p>Set a password for your existing owner account. Google sign-in will stay available.</p>
    <div class="form-grid"><div class="field full"><label for="ownerSetupEmail">Owner email</label><input id="ownerSetupEmail" type="email" value="${escapeHTML(AUTH.currentUser.email)}" readonly autocomplete="username"></div>
    <div class="field full"><label for="ownerNewPassword">New password</label><input id="ownerNewPassword" type="password" autocomplete="new-password" minlength="8" required></div>
    <div class="field full"><label for="ownerConfirmPassword">Confirm new password</label><input id="ownerConfirmPassword" type="password" autocomplete="new-password" minlength="8" required></div></div>
    <p id="ownerEmailSetupMessage" role="status">Enter your password privately. It goes directly to Firebase Authentication.</p></div>
    <div class="modal-foot"><button type="button" class="btn" onclick="closeOwnerEmailSetup()">Cancel</button><button type="submit" id="ownerEmailSetupSave" class="btn btn-primary">Enable my email sign-in</button></div></form>`);
  document.getElementById('ownerEmailSetupForm').onsubmit=async event=>{
    event.preventDefault();if(AUTH_BUSY)return;
    const user=AUTH.currentUser,uid=AUTH_OWNER?.uid,epoch=AUTH_EPOCH,message=document.getElementById('ownerEmailSetupMessage');
    const password=document.getElementById('ownerNewPassword').value,confirmation=document.getElementById('ownerConfirmPassword').value;
    if(!uid||user?.uid!==uid||!user.emailVerified){closeOwnerEmailSetup();return;}
    if(password!==confirmation){message.textContent='The passwords do not match. Please enter them again.';return;}
    AUTH_BUSY=true;document.getElementById('ownerEmailSetupSave').disabled=true;
    try {
      // Set the password on this signed-in user. Do not create an account,
      // change the email or unlink Google (Firebase updatePassword API).
      await user.updatePassword(password);
      await user.reload();
      if(epoch!==AUTH_EPOCH||AUTH.currentUser?.uid!==uid||AUTH_OWNER?.uid!==uid)return;
      closeOwnerEmailSetup();renderSettings();
      toast('Email sign-in added to your existing owner account. Google sign-in remains available.');
    }catch(error){
      message.textContent=error.code==='auth/requires-recent-login'?'Sign out and continue with Google again, then retry password setup.':error.code==='auth/credential-already-in-use'?'This email credential belongs to another account. Keep using Google and review account setup; no accounts were merged.':authErrorMessage(error);
    }finally{
      AUTH_BUSY=false;
      for(const id of ['ownerNewPassword','ownerConfirmPassword']){const el=document.getElementById(id);if(el)el.value='';}
      const button=document.getElementById('ownerEmailSetupSave');if(button)button.disabled=false;
    }
  };
}
async function sendOwnerReset() {
  if(!AUTH||AUTH_BUSY)return;
  const email=AUTH.currentUser?.email||document.getElementById('loginUsername').value.trim();
  if(!email||!email.includes('@')){loginMessage('Enter your owner email address to request a password reset.');return;}
  AUTH_BUSY=true;
  try {
    await AUTH.sendPasswordResetEmail(email,{url:'https://techtoysinternational.github.io/tech-toys-quotation-app/'});
    const message='If this account supports password sign-in, a reset email has been sent. Set the password privately from that email.';
    if(AUTH_OWNER)toast(message);else loginMessage(message);
  }catch(error){loginMessage(authErrorMessage(error));}
  finally{AUTH_BUSY=false;}
}
async function logout() {
  const pending=SYNC_DIRTY||SYNC_SAVING||SYNC_CONFLICT;
  if(pending&&!confirm('Some changes are saved on this device but not yet synced. Keep the private local copy and sign out?'))return;
  AUTH_EPOCH++;stopCloudSync();AUTH_OWNER=null;
  hidePrivateViews();
  if(AUTH)await AUTH.signOut();
  DB=null;
  sessionStorage.removeItem(SESSION_KEY);sessionStorage.removeItem(USER_KEY);
  loginMessage('Signed out. Your saved device copy is retained.');
}
async function initOwnerAccess() {
  try {
    if(!await loadCloudSdkForHostedApp()) {loginMessage('Open the published HTTPS app to sign in. This private test build does not connect from a local file.');return;}
    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
    AUTH=firebase.auth();CLOUD_DB=firebase.firestore();
    await AUTH.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    AUTH.onAuthStateChanged(async user=>{
      const epoch=++AUTH_EPOCH;
      stopCloudSync();AUTH_OWNER=null;
      hidePrivateViews();
      if(!user){loginMessage('Sign in with your approved owner account.');return;}
      if(!user.emailVerified){loginMessage('Verify your email using Firebase’s verification email, then sign in again.');return;}
      try {
        const membership=await CLOUD_DB.collection('appAccess').doc(user.uid).get({source:'server'});
        if(epoch!==AUTH_EPOCH)return;
        const access=membership.exists&&membership.data();
        if(!access||access.role!=='owner'||access.active!==true||typeof access.username!=='string')throw new Error('Owner approval missing');
        AUTH_OWNER={uid:user.uid,username:access.username};
        loadDB();
        await initCloudSync();
      }catch(error){
        if(epoch!==AUTH_EPOCH)return;
        AUTH_OWNER=null;
        loginMessage('Owner access could not be confirmed. Check account setup and connection. Saved data has not been replaced.');
      }
    });
  }catch(error){loginMessage(authErrorMessage(error));}
}


/* -------- Utilities -------- */
const inrWholeFormatter = new Intl.NumberFormat('en-IN', {maximumFractionDigits:0});
const inrDecimalFormatter = new Intl.NumberFormat('en-IN', {minimumFractionDigits:2,maximumFractionDigits:2});
const numberFormatter = new Intl.NumberFormat('en-IN');
const fmtINR = n => '₹' + inrWholeFormatter.format(Number(n)||0);
const fmtINR2 = n => '₹' + inrDecimalFormatter.format(Number(n)||0);
const fmtNum = n => numberFormatter.format(Number(n)||0);
const fmtDate = d => {
  if(!d) return '—';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
};
const today = () => new Date().toISOString().slice(0,10);
const escapeHTML = s => String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function quoteSubtotal(q){ return q.items.reduce((s,it)=>s + (it.qty||0)*(it.price||0), 0); }
function quoteAfterDiscount(q){ return Math.max(0, quoteSubtotal(q) - (q.discount||0)); }
function quoteTax(q){ return quoteAfterDiscount(q) * (q.tax_pct||0)/100; }
function quoteTotal(q){ return quoteAfterDiscount(q) + quoteTax(q); }
function quoteCollected(q){
  if(Array.isArray(q.payments)) return q.payments.reduce((s,p)=>s+(+p.amount||0), 0);
  return +q.amount_paid || 0; // legacy fallback before payments[] was migrated
}
function quoteOutstanding(q){
  if(q.status==='Lost') return 0;
  return Math.max(0, quoteTotal(q) - quoteCollected(q));
}

function toast(msg, type='info'){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = type==='error' ? 'var(--red)' : 'var(--accent)';
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove('show'), 2200);
}

let quotesFilter = {q:'', status:''};
let selectedQuoteIds = new Set();

function toggleQuoteSelection(id, checked){
  if(checked) selectedQuoteIds.add(id);
  else selectedQuoteIds.delete(id);
  renderQuotes();
}
function toggleAllQuotesVisible(){
  // List of currently-visible quote IDs comes from the rendered table
  const visibleIds = Array.from(document.querySelectorAll('input.qs-row-check')).map(el=>el.dataset.qid);
  const allChecked = visibleIds.length > 0 && visibleIds.every(id => selectedQuoteIds.has(id));
  if(allChecked) visibleIds.forEach(id => selectedQuoteIds.delete(id));
  else visibleIds.forEach(id => selectedQuoteIds.add(id));
  renderQuotes();
}
function clearQuoteSelection(){
  selectedQuoteIds.clear();
  renderQuotes();
}

function renderQuotes(){
  let qs = filterQuotesByFY([...DB.quotes]);
  const totalInFY = qs.length;
  if(quotesFilter.q){
    const t = quotesFilter.q.toLowerCase();
    qs = qs.filter(q=>{
      const linked = q.client_id ? (DB.clients||[]).find(c=>c.id===q.client_id) : null;
      const hay = ((linked?linked.name:q.client)||'') + ' ' + (q.project_name||'') + ' ' + (q.client||'') + ' ' + (q.pi_no||'');

  qs.sort((a,b)=>(b.date||'').localeCompare(a.date||''));

function updateQuoteField(id, field, val){
  const q = DB.quotes.find(x=>x.id===id);
  if(!q) return;
  q[field] = val;
  q.updated = new Date().toISOString();
  saveDB();
  if(field==='status') renderQuoteDetail(id);
  toast('Saved');
}

function duplicateQuote(id){
  const src = DB.quotes.find(x=>x.id===id);
  if(!src) return;
  const newId = nextQuoteId();
  const newPi = nextPiNo();
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = newId;
  copy.pi_no = newPi;
  // Keep client + client_id link intact; only mark the project as a copy
  copy.project_name = (src.project_name || src.client || '') + ' (copy)';
  copy.date = today();
  copy.status = 'Draft';
  copy.amount_paid = 0;
  copy.payments = []; // duplicates start with no payments
  copy.created = new Date().toISOString();
  copy.updated = copy.created;
  DB.quotes.push(copy);
  saveDB();
  toast('Quote duplicated');
  navigate('edit-quote', newId);
}

/* -------- Payments -------- */
const PAYMENT_MODES = ['Cash','Bank Transfer','Cheque','UPI','Card','Other'];

function recomputeAmountPaid(q){
  q.amount_paid = (q.payments||[]).reduce((s,p)=>s+(+p.amount||0), 0);
}

function maybeAutoFlipPaid(q){
  // Auto-progress quote status based on collected amount.
  // Sent → Won when an advance is recorded (any payment > 0 but < total).
  // Sent/Won → Paid when fully collected.
  // Never touches Draft or Lost.
  const total = quoteTotal(q);
  const collected = quoteCollected(q);
  if(total <= 0) return null;
  if(collected >= total && (q.status==='Sent' || q.status==='Won')){
    q.status = 'Paid';
    return 'Paid';
  }
  if(collected > 0 && collected < total && q.status==='Sent'){
    q.status = 'Won';
    return 'Won';
  }
  return null;
}

function openPaymentModal(quoteId, paymentId){
  const q = DB.quotes.find(x=>x.id===quoteId);

  openModal(`
    <div class="modal-head">

      <button class="btn btn-icon btn-ghost" onclick="closeModal()">×</button>

          </select>

    </div>
  `);

function savePayment(quoteId, paymentId){
  const q = DB.quotes.find(x=>x.id===quoteId);
  if(!q) return;
  if(!Array.isArray(q.payments)) q.payments = [];
  const date = document.getElementById('ep_date').value;
  const amount = +document.getElementById('ep_amt').value || 0;
  const mode = document.getElementById('ep_mode').value;
  const ref = document.getElementById('ep_ref').value.trim();
  const note = document.getElementById('ep_note').value.trim();
  if(!date){ alert('Please pick a date'); return; }
  if(amount <= 0){ alert('Amount must be greater than 0'); return; }
  // Warn (but allow) overpayment
  const otherPaid = quoteCollected(q) - (paymentId ? (q.payments.find(p=>p.id===paymentId)||{}).amount || 0 : 0);
  if(otherPaid + amount > quoteTotal(q) + 1){
    if(!confirm(`This payment will make total collected (${fmtINR(otherPaid+amount)}) exceed the grand total (${fmtINR(quoteTotal(q))}). Save anyway?`)) return;
  }
  if(paymentId){
    const idx = q.payments.findIndex(p=>p.id===paymentId);
    if(idx>=0) q.payments[idx] = {...q.payments[idx], date, amount, mode, ref, note};
  } else {
    q.payments.push({
      id: 'PMT' + Date.now() + Math.floor(Math.random()*1000),
      date, amount, mode, ref, note,
    });
  }
  recomputeAmountPaid(q);
  const flipped = maybeAutoFlipPaid(q);
  q.updated = new Date().toISOString();
  saveDB();
  closeModal();
  toast(flipped ? `Payment saved · status auto-set to ${flipped}` : 'Payment saved');
  renderQuoteDetail(q.id);
}

function deletePayment(quoteId, paymentId){
  const q = DB.quotes.find(x=>x.id===quoteId);
  if(!q || !Array.isArray(q.payments)) return;
  const p = q.payments.find(x=>x.id===paymentId);
  if(!p) return;
  if(!confirm(`Delete payment of ${fmtINR(p.amount)} dated ${fmtDate(p.date)}? This cannot be undone.`)) return;
  q.payments = q.payments.filter(x=>x.id!==paymentId);
  recomputeAmountPaid(q);
  q.updated = new Date().toISOString();
  saveDB();
  closeModal();
  toast('Payment deleted');
  renderQuoteDetail(q.id);
}

/* -------- Expenses (per quote) -------- */
function quoteExpensesTotal(q){
  return (q.expenses || []).reduce((s,e)=>s+(+e.amount||0), 0);
}
function addExpenseRow(quoteId){
  const q = DB.quotes.find(x=>x.id===quoteId);
  if(!q) return;
  if(!Array.isArray(q.expenses)) q.expenses = [];
  q.expenses.push({
    id: 'EXP' + Date.now() + Math.floor(Math.random()*1000),
    date: today(),
    category: 'Product',
    description: '',
    amount: 0,
  });
  q.updated = new Date().toISOString();
  saveDB();
  renderQuoteDetail(quoteId);
  // focus the new row's description field
  setTimeout(()=>{
    const inputs = document.querySelectorAll(`input[data-eq="${quoteId}"][data-ef="description"]`);
    if(inputs.length) inputs[inputs.length-1].focus();
  }, 30);
}
function removeExpenseRow(quoteId, idx){
  const q = DB.quotes.find(x=>x.id===quoteId);
  if(!q || !Array.isArray(q.expenses) || idx >= q.expenses.length) return;
  const e = q.expenses[idx];
  if((+e.amount||0) > 0 || e.description){
    if(!confirm(`Remove expense "${e.description||'(no description)'}" of ${fmtINR(e.amount||0)}?`)) return;
  }
  q.expenses.splice(idx, 1);
  q.updated = new Date().toISOString();
  saveDB();
  renderQuoteDetail(quoteId);
}
function onExpenseInput(ev){
  const el = ev.target;
  const quoteId = el.dataset.eq;
  const idx = +el.dataset.ei;
  const field = el.dataset.ef;
  const q = DB.quotes.find(x=>x.id===quoteId);
  if(!q || !Array.isArray(q.expenses) || idx >= q.expenses.length) return;
  let val = el.value;
  if(field === 'amount') val = +val || 0;
  q.expenses[idx][field] = val;
  q.updated = new Date().toISOString();
  saveDB();
  // Update only the totals row in-place (don't re-render the table — would steal focus)
  const totalEl = document.getElementById('qd_exp_total');
  const marginEl = document.getElementById('qd_margin');
  if(totalEl) totalEl.textContent = fmtINR(quoteExpensesTotal(q));
  if(marginEl){
    const m = quoteCollected(q) - quoteExpensesTotal(q);
    marginEl.textContent = fmtINR(m);
    marginEl.style.color = m >= 0 ? 'var(--green)' : 'var(--red)';
  }
}

function deleteQuote(id){
  if(!confirm('Delete this quotation? This cannot be undone.')) return;
  DB.quotes = DB.quotes.filter(q=>q.id!==id);

  toast('Deleted');

}

function nextQuoteId(){
  let n = 1;
  while(DB.quotes.find(q=>q.id===`Q${String(n).padStart(4,'0')}`)) n++;

}
function nextPiNo(){
  const seq = (DB.next_pi_seq || 250) + 1;
  DB.next_pi_seq = seq;
  return `PI-25-${String(seq).padStart(3,'0')}`;
}

    ? `<div class="ac-item" data-action="create-new" style="background:var(--accent-dim);color:var(--accent2);font-weight:600;border-top:1px solid var(--border)">
         + Create new client &ldquo;${escapeHTML(typed)}&rdquo;

       </div>`
    : `<div class="ac-item" data-action="create-new" style="color:var(--accent2);font-weight:600">+ Add a new client</div>`;
  if(items.length === 0){
    list.innerHTML = `<div class="ac-item" style="color:var(--muted);font-style:italic">No matching clients</div>` + createRow;
  } else {

  });

    el.addEventListener('mousedown', e=>{
      e.preventDefault();
      hideClientAC();
      // Open the editClient modal pre-filled with whatever they typed
      editClient();
      setTimeout(()=>{
        const nm = document.getElementById('ec_name');
        if(nm && typed) nm.value = typed;
        const cp = document.getElementById('ec_cp'); if(cp) cp.focus();
      }, 50);
    });
  });

function hideClientAC(){
  const list = document.getElementById('clientAcList');
  if(list){ list.classList.remove('show'); list._sel = -1; }
}
function onClientACKey(e){
  const list = document.getElementById('clientAcList');
  if(!list || !list.classList.contains('show')) return;
  const items = list.querySelectorAll('.ac-item[data-cid]');
  if(!items.length) return;
  if(e.key === 'ArrowDown'){ e.preventDefault(); list._sel = (list._sel+1) % items.length; items.forEach((el,j)=>el.classList.toggle('sel', j===list._sel)); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); list._sel = list._sel<=0?items.length-1:list._sel-1; items.forEach((el,j)=>el.classList.toggle('sel', j===list._sel)); }
  else if(e.key === 'Enter' && list._sel >= 0){ e.preventDefault(); pickClient(items[list._sel].dataset.cid); }
  else if(e.key === 'Escape'){ hideClientAC(); }
}
function pickClient(cid){
  const c = DB.clients.find(x=>x.id===cid);
  if(!c) return;
  editingQuote.client = c.name;
  editingQuote.client_id = c.id;
  document.getElementById('eq_client').value = c.name;
  const link = document.getElementById('eq_client_link');
  if(link) link.innerHTML = `Linked to <b>${escapeHTML(c.name)}</b> · ${c.gstin?'GST '+escapeHTML(c.gstin)+' · ':''}<a href="#" onclick="event.preventDefault();unlinkClient()">Unlink</a>`;

  const dl = document.getElementById('eq_proj_list');
  if(dl) dl.innerHTML = (c.projects||[]).map(p=>`<option value="${escapeHTML(p)}">`).join('');

function unlinkClient(){

function onLineInput(e){
  const i = +e.target.dataset.idx;
  const f = e.target.dataset.field;
  let v = e.target.value;
  if(f==='qty' || f==='price') v = +v || 0;
  editingQuote.items[i][f] = v;
  // update amount cell
  const row = e.target.closest('tr');
  if(row){
    const amtCell = row.querySelector('.li-amt');
    if(amtCell){
      const it = editingQuote.items[i];
      amtCell.textContent = fmtINR((it.qty||0)*(it.price||0));
    }
  }
  renderTotals();
}
function onLineBlur(e){
  // when price was changed and we have a known product, offer to update catalog
  const i = +e.target.dataset.idx;
  const f = e.target.dataset.field;
  if(f !== 'price') return;
  const it = editingQuote.items[i];
  if(!it.make || !it.price) return;
  // find existing catalog match
  const match = DB.products.find(p=>p.make.toLowerCase()===it.make.toLowerCase() && p.desc.toLowerCase()===(it.desc||'').toLowerCase());
  if(match && match.price !== it.price && match.price > 0){
    if(it._priceAsked) return;
    it._priceAsked = true;
    setTimeout(()=>{
      if(confirm(`Update catalog price for "${match.make}" from ${fmtINR(match.price)} to ${fmtINR(it.price)}?`)){
        match.price = it.price;
        saveDB();
        toast('Catalog price updated');
      }
    }, 100);
  }
}

function removeLineItem(i){

}

/* Autocomplete for product picker */
function onMakeInput(e){
  const i = +e.target.dataset.idx;
  const txt = e.target.value.trim().toLowerCase();
  editingQuote.items[i].make = e.target.value;
  if(txt.length < 1){ hideAC(i); return; }
  const matches = DB.products.filter(p=>{
    const hay = (p.make + ' ' + p.desc + ' ' + (p.category||'')).toLowerCase();
    return txt.split(/\s+/).every(t=>hay.includes(t));
  }).slice(0, 12);
  showAC(i, matches);
}
function showAC(i, items){
  const list = document.querySelector(`.ac-list[data-idx="${i}"]`);
  if(!list) return;
  if(items.length === 0){ hideAC(i); return; }
  list.innerHTML = items.map((p,j)=>`
    <div class="ac-item" data-pid="${p.id}" data-pi="${j}">
      <div><span class="ac-make">${escapeHTML(p.make)}</span> <span class="ac-meta">${fmtINR(p.price)}</span></div>
      <div class="ac-desc">${escapeHTML(p.desc)} ${p.category?`<span class="tag">${escapeHTML(p.category)}</span>`:''}</div>
    </div>
  `).join('');
  list.querySelectorAll('.ac-item').forEach(el=>{
    el.addEventListener('mousedown', e=>{
      e.preventDefault();
      pickProduct(i, el.dataset.pid);
    });
  });
  list._items = items;
  list._sel = -1;
  list.classList.add('show');
}
function hideAC(i){
  const list = document.querySelector(`.ac-list[data-idx="${i}"]`);
  if(list){ list.classList.remove('show'); list._sel = -1; }
}
function onACKeydown(e, i){
  const list = document.querySelector(`.ac-list[data-idx="${i}"]`);
  if(!list || !list.classList.contains('show')) return;
  const items = list.querySelectorAll('.ac-item');
  if(!items.length) return;
  if(e.key === 'ArrowDown'){ e.preventDefault(); list._sel = (list._sel+1) % items.length; updateACSel(list); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); list._sel = (list._sel<=0?items.length-1:list._sel-1); updateACSel(list); }
  else if(e.key === 'Enter' && list._sel >= 0){ e.preventDefault(); pickProduct(i, items[list._sel].dataset.pid); }
  else if(e.key === 'Escape'){ hideAC(i); }
}
function updateACSel(list){
  list.querySelectorAll('.ac-item').forEach((el,j)=>el.classList.toggle('sel', j===list._sel));
  const sel = list.querySelectorAll('.ac-item')[list._sel];
  if(sel) sel.scrollIntoView({block:'nearest'});
}
function pickProduct(i, pid){
  const p = DB.products.find(x=>x.id===pid);
  if(!p) return;
  editingQuote.items[i] = {
    ...editingQuote.items[i],
    make: p.make,
    desc: p.desc,
    code: p.code || '',
    uom: p.uom || 'Nos.',
    country: p.country || '',
    price: p.price || 0,
    qty: editingQuote.items[i].qty || 1,
  };
  hideAC(i);
  renderLineItems();
  renderTotals();
}

  const v = document.getElementById('eq_tax_type').value;

  editingQuote.tax_pct = v==='NONE' ? 0 : 18;

function renderTotals(){

  const total = quoteTotal(q);

  const taxLabel = q.tax_type==='IGST' ? 'IGST 18%' : q.tax_type==='SGST_CGST' ? 'SGST 9% + CGST 9%' : 'No tax';
  const taxBreakdown = q.tax_type==='SGST_CGST'
    ? `<div class="muted" style="font-size:11px;text-align:right;margin-top:-4px;grid-column:1/-1">SGST 9%: ${fmtINR(afterDisc*0.09)} · CGST 9%: ${fmtINR(afterDisc*0.09)}</div>` : '';

  document.getElementById('totalsBox').innerHTML = `
